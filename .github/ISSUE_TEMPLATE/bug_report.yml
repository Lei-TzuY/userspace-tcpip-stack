name: Bug report
description: Report a reproducible parser, capture-reader, analysis, or CLI defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or attach private network captures here. Follow SECURITY.md instead.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide a synthetic fixture, packet description, or exact command. Remove private traffic and credentials.
      render: shell
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit
      description: Commit SHA or branch tested
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, compiler, CMake version, and sanitizer settings
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Sanitizer output or stack trace with secrets removed
      render: text

name: Stage ICMPv6 error suppression

on:
  push:
    branches: [ fix/icmpv6-error-suppression ]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply staged source and regression changes
        run: python scripts/stage_icmpv6_error_suppression.py
      - name: Fix staged regression naming
        run: python scripts/fix_icmpv6_suppression_test_shadow.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff
        run: git diff --check
      - name: Focused suppression tests
        run: cargo test --test test_ipv6_icmp_error_suppression --verbose
      - name: Existing routed IPv6 regression
        run: cargo test --test test_lab_ipv6_routing --verbose
      - name: Existing PMTUD regression
        run: cargo test --test test_ipv6_pmtud --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/lab.rs tests/test_ipv6_icmp_error_suppression.rs
          git diff --cached --check
          git commit -m "fix(ipv6): enforce ICMPv6 error suppression rules"
          git push origin HEAD:fix/icmpv6-error-suppression

name: IPv6 / ICMPv6 / Routing Fuzz Smoke

on:
  push:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "fuzz/**"
      - "src/ipv6.rs"
      - "src/icmpv6.rs"
      - "src/router_ipv6.rs"
      - "src/checksum.rs"
      - ".github/workflows/ipv6-fuzz.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "fuzz/**"
      - "src/ipv6.rs"
      - "src/icmpv6.rs"
      - "src/router_ipv6.rs"
      - "src/checksum.rs"
      - ".github/workflows/ipv6-fuzz.yml"
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:
    inputs:
      runs:
        description: "libFuzzer iterations per IPv6/ICMPv6/routing target"
        required: true
        default: "10000"
        type: string

permissions:
  contents: read

concurrency:
  group: ipv6-fuzz-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FUZZ_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || (github.event_name == 'schedule' && '100000' || '1000') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - name: Install cargo-fuzz 0.13.2
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Validate fuzz run count
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${FUZZ_RUNS}" =~ ^[1-9][0-9]{0,6}$ ]] || (( 10#${FUZZ_RUNS} > 1000000 )); then
            echo "invalid fuzz run count: ${FUZZ_RUNS}; expected an integer from 1 to 1000000" >&2
            exit 1
          fi
      - name: Smoke fuzz IPv6 parser
        run: >-
          cargo fuzz run ipv6_packet_parse --
          -runs=${FUZZ_RUNS}
          -max_len=65575
          -timeout=10
      - name: Smoke fuzz ICMPv6/NDP parser
        run: >-
          cargo fuzz run icmpv6_ndp_parse --
          -runs=${FUZZ_RUNS}
          -max_len=4096
          -timeout=10
      - name: Smoke fuzz IPv6 routing table
        run: >-
          cargo fuzz run ipv6_routing_table --
          -runs=${FUZZ_RUNS}
          -max_len=8192
          -timeout=10
      - name: Smoke fuzz IPv6 NDP state
        run: >-
          cargo fuzz run ipv6_ndp_state --
          -runs=${FUZZ_RUNS}
          -max_len=8192
          -timeout=10

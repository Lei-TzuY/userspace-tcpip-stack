name: Stage NDP link-layer cache learning

on:
  push:
    branches: [ fix/ndp-link-layer-cache-learning ]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply staged source and regression changes
        run: python scripts/stage_ndp_link_layer_learning.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff
        run: git diff --check
      - name: Focused NDP link-layer tests
        run: cargo test --test test_ipv6_ndp_link_layer_options --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/icmpv6.rs src/stack.rs src/lab.rs tests/test_ipv6_ndp_link_layer_options.rs
          git diff --cached --check
          git commit -m "fix(ipv6): honor NDP link-layer address options"
          git push origin HEAD:fix/ndp-link-layer-cache-learning

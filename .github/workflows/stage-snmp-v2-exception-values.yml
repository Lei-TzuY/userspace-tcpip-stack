name: Stage SNMPv2 exception values

on:
  push:
    branches: [ stage/snmp-v2-exception-values ]

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused implementation
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/snmp.rs")
          text = path.read_text()

          replacements = [
              (
                  "pub const BER_TAG_OID: u8 = 0x06;\npub const BER_TAG_SEQUENCE: u8 = 0x30;",
                  "pub const BER_TAG_OID: u8 = 0x06;\npub const BER_TAG_SEQUENCE: u8 = 0x30;\npub const SNMP_EXCEPTION_NO_SUCH_OBJECT: u8 = 0x80;\npub const SNMP_EXCEPTION_NO_SUCH_INSTANCE: u8 = 0x81;\npub const SNMP_EXCEPTION_END_OF_MIB_VIEW: u8 = 0x82;",
              ),
              (
                  "    Null,\n    Oid(String),\n}",
                  "    Null,\n    Oid(String),\n    NoSuchObject,\n    NoSuchInstance,\n    EndOfMibView,\n}",
              ),
              (
                  "            SnmpValue::Null => write!(f, \"NULL\"),\n            SnmpValue::Oid(o) => write!(f, \"OID: {}\", o),",
                  "            SnmpValue::Null => write!(f, \"NULL\"),\n            SnmpValue::Oid(o) => write!(f, \"OID: {}\", o),\n            SnmpValue::NoSuchObject => write!(f, \"noSuchObject\"),\n            SnmpValue::NoSuchInstance => write!(f, \"noSuchInstance\"),\n            SnmpValue::EndOfMibView => write!(f, \"endOfMibView\"),",
              ),
              (
                  "                BER_TAG_OID => SnmpValue::Oid(decode_ber_oid(v_body)?),\n                BER_TAG_NULL if v_body.is_empty() => SnmpValue::Null,\n                BER_TAG_NULL => return Err(SnmpError::InvalidBerEncoding),\n                tag => return Err(SnmpError::UnsupportedTag(tag)),",
                  "                BER_TAG_OID => SnmpValue::Oid(decode_ber_oid(v_body)?),\n                BER_TAG_NULL if v_body.is_empty() => SnmpValue::Null,\n                BER_TAG_NULL => return Err(SnmpError::InvalidBerEncoding),\n                SNMP_EXCEPTION_NO_SUCH_OBJECT if v_body.is_empty() => SnmpValue::NoSuchObject,\n                SNMP_EXCEPTION_NO_SUCH_INSTANCE if v_body.is_empty() => {\n                    SnmpValue::NoSuchInstance\n                }\n                SNMP_EXCEPTION_END_OF_MIB_VIEW if v_body.is_empty() => SnmpValue::EndOfMibView,\n                SNMP_EXCEPTION_NO_SUCH_OBJECT\n                | SNMP_EXCEPTION_NO_SUCH_INSTANCE\n                | SNMP_EXCEPTION_END_OF_MIB_VIEW => return Err(SnmpError::InvalidBerEncoding),\n                tag => return Err(SnmpError::UnsupportedTag(tag)),",
              ),
              (
                  "                SnmpValue::Null => vb_bytes.extend(encode_ber_null()),\n                SnmpValue::Oid(o) => vb_bytes.extend(encode_ber_oid(o)?),",
                  "                SnmpValue::Null => vb_bytes.extend(encode_ber_null()),\n                SnmpValue::Oid(o) => vb_bytes.extend(encode_ber_oid(o)?),\n                SnmpValue::NoSuchObject => {\n                    vb_bytes.extend([SNMP_EXCEPTION_NO_SUCH_OBJECT, 0]);\n                }\n                SnmpValue::NoSuchInstance => {\n                    vb_bytes.extend([SNMP_EXCEPTION_NO_SUCH_INSTANCE, 0]);\n                }\n                SnmpValue::EndOfMibView => {\n                    vb_bytes.extend([SNMP_EXCEPTION_END_OF_MIB_VIEW, 0]);\n                }",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected source fragment not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          anchor = "    #[test]\n    fn test_snmp_mib_store() {"
          tests = r'''    #[test]
    fn test_snmp_v2_exception_values_roundtrip() {
        for (value, tag) in [
            (SnmpValue::NoSuchObject, SNMP_EXCEPTION_NO_SUCH_OBJECT),
            (SnmpValue::NoSuchInstance, SNMP_EXCEPTION_NO_SUCH_INSTANCE),
            (SnmpValue::EndOfMibView, SNMP_EXCEPTION_END_OF_MIB_VIEW),
        ] {
            let mut msg =
                SnmpMessage::build_get_request("public", 1, &["1.3.6.1.2.1.1.1.0"]);
            msg.pdu.pdu_type = SNMP_PDU_RESPONSE;
            msg.pdu.varbinds[0].value = value.clone();

            let raw = msg.try_serialize().unwrap();
            assert!(raw.windows(2).any(|window| window == [tag, 0]));
            let parsed = SnmpMessage::parse(&raw).unwrap();
            assert_eq!(parsed.pdu.varbinds[0].value, value);
        }
    }

    #[test]
    fn test_snmp_v2_exception_values_require_zero_length() {
        for tag in [
            SNMP_EXCEPTION_NO_SUCH_OBJECT,
            SNMP_EXCEPTION_NO_SUCH_INSTANCE,
            SNMP_EXCEPTION_END_OF_MIB_VIEW,
        ] {
            let mut msg =
                SnmpMessage::build_get_request("public", 1, &["1.3.6.1.2.1.1.1.0"]);
            msg.pdu.pdu_type = SNMP_PDU_RESPONSE;
            msg.pdu.varbinds[0].value = SnmpValue::NoSuchObject;
            let mut raw = msg.try_serialize().unwrap();
            let value_offset = raw
                .windows(2)
                .rposition(|window| window == [SNMP_EXCEPTION_NO_SUCH_OBJECT, 0])
                .unwrap();
            raw[value_offset] = tag;
            raw[value_offset + 1] = 1;
            raw.insert(value_offset + 2, 0);

            // Extend enclosing varbind, varbind-list, PDU, and root lengths by one.
            let mut offsets = Vec::new();
            let mut pos = 0usize;
            while pos < value_offset {
                let (_, _, used) = decode_ber_tlv(&raw[pos..]).unwrap_or((0, &[], 0));
                if used == 0 {
                    break;
                }
                offsets.push(pos);
                pos += used;
            }
            // This malformed-value regression is easier and less brittle by starting from
            // a minimal hand-assembled response carrying one varbind.
            let oid = encode_ber_oid("1.3.6.1.2.1.1.1.0").unwrap();
            let mut vb_body = oid;
            vb_body.extend([tag, 1, 0]);
            let mut vb = vec![BER_TAG_SEQUENCE];
            vb.extend(encode_ber_length(vb_body.len()));
            vb.extend(vb_body);
            let mut vb_list = vec![BER_TAG_SEQUENCE];
            vb_list.extend(encode_ber_length(vb.len()));
            vb_list.extend(vb);
            let mut pdu_body = Vec::new();
            pdu_body.extend(encode_ber_integer(1));
            pdu_body.extend(encode_ber_integer(0));
            pdu_body.extend(encode_ber_integer(0));
            pdu_body.extend(vb_list);
            let mut pdu = vec![SNMP_PDU_RESPONSE];
            pdu.extend(encode_ber_length(pdu_body.len()));
            pdu.extend(pdu_body);
            let mut body = Vec::new();
            body.extend(encode_ber_integer(SNMP_VERSION_2C));
            body.extend(encode_ber_string("public"));
            body.extend(pdu);
            let mut packet = vec![BER_TAG_SEQUENCE];
            packet.extend(encode_ber_length(body.len()));
            packet.extend(body);

            assert_eq!(SnmpMessage::parse(&packet), Err(SnmpError::InvalidBerEncoding));
        }
    }

'''
          if anchor not in text:
              raise SystemExit("test insertion anchor not found")
          text = text.replace(anchor, tests + anchor, 1)
          path.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets --verbose
          cargo build --release --verbose
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet -- src/snmp.rs; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/snmp.rs
          git commit -m "fix(snmp): support SNMPv2 exception values"
          git push

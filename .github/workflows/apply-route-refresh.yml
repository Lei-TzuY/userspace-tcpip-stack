name: Apply Route Refresh Patch

on:
  push:
    branches: [ feat/bgp-route-refresh ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bgp-route-refresh
      - name: Apply patch
        run: python scripts/apply_route_refresh.py
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bgp.rs src/bgp_caps.rs src/bgp_router.rs tests/test_bgp_route_refresh.rs
          git commit -m "feat(bgp): implement RFC 2918 route refresh"
          git push

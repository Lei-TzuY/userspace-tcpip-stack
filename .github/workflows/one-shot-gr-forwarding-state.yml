name: one-shot-gr-forwarding-state

on:
  push:
    branches: [fix/bgp-gr-forwarding-state]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply RFC 4724 Forwarding State fix
        shell: bash
        run: |
          echo ' xKQ== ' | tr -d ' ' >/tmp/part

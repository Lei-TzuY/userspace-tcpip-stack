name: one-shot-gr-forwarding-state

on:
  push:
    branches: [fix/bgp-gr-forwarding-state]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply RFC 4724 Forwarding State fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/bgp_router.rs')
          s = p.read_text()

          old = '''    /// Families whose local RIB recovery has not yet been declared complete.\n    graceful_restart_recovery_pending: BTreeSet<AfiSafi>,\n'''
          new = '''    /// Families whose forwarding plane survives a simulated local control-plane restart.\n    /// RFC 4724's Forwarding State bit is set for these families in replacement OPENs.\n    graceful_restart_forwarding_preserved: BTreeSet<AfiSafi>,\n    /// Families whose local RIB recovery has not yet been declared complete.\n    graceful_restart_recovery_pending: BTreeSet<AfiSafi>,\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            graceful_restart_restarting: false,\n            graceful_restart_recovery_pending: BTreeSet::new(),\n'''
          new = '''            graceful_restart_restarting: false,\n            graceful_restart_forwarding_preserved: BTreeSet::from([AfiSafi::IPV4_UNICAST]),\n            graceful_restart_recovery_pending: BTreeSet::new(),\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    pub fn set_graceful_restart_time(&mut self, seconds: u16) {\n        self.graceful_restart_time = seconds.min(crate::bgp_caps::BGP_GR_MAX_RESTART_TIME);\n    }\n\n    /// True while local RFC 4724 restarting-speaker mode is active.\n'''
          new = '''    pub fn set_graceful_restart_time(&mut self, seconds: u16) {\n        self.graceful_restart_time = seconds.min(crate::bgp_caps::BGP_GR_MAX_RESTART_TIME);\n    }\n\n    /// Configures whether a family's forwarding plane survives the simulated local\n    /// control-plane restart. RFC 4724 requires the replacement OPEN's Forwarding\n    /// State bit to describe what actually survived, not merely GR capability.\n    pub fn set_graceful_restart_forwarding_preserved(\n        &mut self,\n        family: AfiSafi,\n        preserved: bool,\n    ) {\n        if preserved {\n            self.graceful_restart_forwarding_preserved.insert(family);\n        } else {\n            self.graceful_restart_forwarding_preserved.remove(&family);\n        }\n    }\n\n    /// True while local RFC 4724 restarting-speaker mode is active.\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                        .iter()\n                        .copied()\n                        .map(|family| BgpGracefulRestartFamily::new(family, false))\n                        .collect(),\n'''
          new = '''                        .iter()\n                        .copied()\n                        .map(|family| {\n                            let forwarding_state = self.graceful_restart_restarting\n                                && self.graceful_restart_forwarding_preserved.contains(&family);\n                            BgpGracefulRestartFamily::new(family, forwarding_state)\n                        })\n                        .collect(),\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    pub fn enable_family(&mut self, family: AfiSafi) {\n        self.families.insert(family);\n    }\n'''
          new = '''    pub fn enable_family(&mut self, family: AfiSafi) {\n        self.families.insert(family);\n        // `begin_graceful_restart` models a control-plane-only restart, so newly\n        // enabled families preserve forwarding by default unless configured otherwise.\n        self.graceful_restart_forwarding_preserved.insert(family);\n    }\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        let supported: BTreeSet<AfiSafi> = gr\n            .families\n            .iter()\n            .map(|f| f.family)\n            .filter(|family| negotiated.supports(*family))\n            .collect();\n'''
          new = '''        let supported: BTreeSet<AfiSafi> = gr\n            .families\n            .iter()\n            .filter(|f| f.forwarding_state)\n            .map(|f| f.family)\n            .filter(|family| negotiated.supports(*family))\n            .collect();\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/test_bgp_graceful_restart.rs')
          s = p.read_text()

          old = '''    assert!(\n        restart_cap.restarting,\n        "replacement OPEN did not set Restart State"\n    );\n    assert!(helper_peer.graceful_restart_active());\n'''
          new = '''    assert!(\n        restart_cap.restarting,\n        "replacement OPEN did not set Restart State"\n    );\n    assert!(\n        restart_cap\n            .families\n            .iter()\n            .any(|f| f.family == AfiSafi::IPV4_UNICAST && f.forwarding_state),\n        "control-plane-only restart did not advertise preserved IPv4 forwarding state"\n    );\n    assert!(helper_peer.graceful_restart_active());\n'''
          assert old in s
          s = s.replace(old, new, 1)

          s += r'''

#[test]
fn test_reconnect_without_forwarding_state_purges_stale_family() {
    let mut lab = build_linear_lab();
    assert!(converge_sessions(&mut lab, 60_000));

    let now = lab.current_time_ms;
    {
        let r3 = lab.router_mut("r3").unwrap();
        let (bgp, sockets) = (&mut r3.bgp, &mut r3.sockets);
        let bgp = bgp.as_mut().unwrap();
        bgp.set_graceful_restart_forwarding_preserved(AfiSafi::IPV4_UNICAST, false);
        assert!(bgp.begin_graceful_restart(now, sockets.as_mut().unwrap()));
    }

    // The helper retains the old RIB immediately after transport failure because
    // the previous OPEN had advertised GR support for IPv4.
    lab.run_pumped(100);
    assert!(
        lab.router("r2")
            .unwrap()
            .bgp()
            .unwrap()
            .peer(ip(10, 23, 0, 3))
            .unwrap()
            .graceful_restart_active()
    );

    lab.link_mut("r2r3").unwrap().set_blackhole(true);
    lab.advance_time(1_000);
    lab.run_pumped(50);
    lab.link_mut("r2r3").unwrap().set_blackhole(false);
    assert!(converge_sessions(&mut lab, 60_000));

    let helper_peer = lab
        .router("r2")
        .unwrap()
        .bgp()
        .unwrap()
        .peer(ip(10, 23, 0, 3))
        .unwrap();
    let restart_cap = helper_peer
        .negotiated
        .peer
        .graceful_restart()
        .expect("replacement OPEN omitted RFC 4724");
    assert!(restart_cap.restarting);
    assert!(
        restart_cap
            .families
            .iter()
            .any(|f| f.family == AfiSafi::IPV4_UNICAST && !f.forwarding_state),
        "test peer unexpectedly advertised preserved forwarding state"
    );
    assert!(
        !helper_peer.graceful_restart_active(),
        "RFC 4724 helper retained stale IPv4 state after replacement OPEN cleared F"
    );
}
'''
          p.write_text(s)
          PY
      - name: Format
        run: cargo fmt --all -- --check || cargo fmt --all
      - name: Focused Graceful Restart tests
        run: cargo test --test test_bgp_graceful_restart
      - name: Full test suite
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Commit validated change and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-gr-forwarding-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bgp_router.rs tests/test_bgp_graceful_restart.rs .github/workflows/one-shot-gr-forwarding-state.yml
          git commit -m "fix(bgp): honor RFC 4724 forwarding state"
          git push origin HEAD:fix/bgp-gr-forwarding-state

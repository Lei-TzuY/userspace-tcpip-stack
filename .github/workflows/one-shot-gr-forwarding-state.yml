name: one-shot-gr-forwarding-state

on:
  push:
    branches: [fix/bgp-gr-forwarding-state]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python3 /tmp/patch.py
      - name: Format
        run: cargo fmt --all -- --check || cargo fmt --all
      - name: Focused tests
        run: cargo test --test test_bgp_graceful_restart
      - name: Full tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Commit validated change
        run: |
          rm .github/workflows/one-shot-gr-forwarding-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bgp_router.rs tests/test_bgp_graceful_restart.rs .github/workflows/one-shot-gr-forwarding-state.yml
          git commit -m "fix(bgp): honor RFC 4724 forwarding state"
          git push origin HEAD:fix/bgp-gr-forwarding-state

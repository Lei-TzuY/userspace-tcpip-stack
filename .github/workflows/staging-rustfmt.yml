name: Staging Rustfmt

on:
  push:
    branches:
      - staging/snmp-promoter-rustfmt

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/promote_snmp_fuzz_artifact.rs
          git commit -m "staging: apply canonical rustfmt"
          git push

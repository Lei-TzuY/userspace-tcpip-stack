name: One-shot rustfmt baseline

on:
  push:
    branches:
      - chore/rustfmt-baseline

permissions:
  contents: write

jobs:
  format-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo build --release
          rm .github/workflows/one-shot-rustfmt-baseline.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: apply rustfmt baseline'
          git push origin HEAD:chore/rustfmt-baseline

name: One-shot IOAM node-count validation

on:
  push:
    branches:
      - stage/ioam-node-count-validation

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/ioam-node-count-validation
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch, test, and clean branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("src/ioam.rs")
          s = p.read_text()
          old = (
              "        let trace_type = u32::from_be_bytes([data[4], data[5], data[6], data[7]]);\n"
              "\n"
              "        let mut node_records = Vec::new();\n"
              "        let mut offset = 8;\n"
              "\n"
              "        for _ in 0..node_count {\n"
              "            if offset + 20 > data.len() {\n"
              "                break;\n"
              "            }\n"
          )
          new = (
              "        let trace_type = u32::from_be_bytes([data[4], data[5], data[6], data[7]]);\n"
              "        let records_len = node_count.checked_mul(20)?;\n"
              "        let header_len = 8usize.checked_add(records_len)?;\n"
              "        if header_len > data.len() {\n"
              "            return None;\n"
              "        }\n"
              "\n"
              "        let mut node_records = Vec::new();\n"
              "        let mut offset = 8;\n"
              "\n"
              "        for _ in 0..node_count {\n"
          )
          if s.count(old) != 1:
              raise SystemExit(f"IOAM parse anchor count={s.count(old)}")
          s = s.replace(old, new, 1)
          insert_at = s.rfind("\n}")
          if insert_at < 0:
              raise SystemExit("test module closing brace not found")
          tests = "\n".join([
              "",
              "    #[test]",
              "    fn test_ioam_rejects_missing_declared_node_record() {",
              "        let raw = [0x00, 0x01, 0x01, 0x00, 0, 0, 0, 0];",
              "        assert_eq!(IoamPacket::parse(&raw), Err(IoamError::InvalidLength));",
              "    }",
              "",
              "    #[test]",
              "    fn test_ioam_rejects_partial_declared_node_record() {",
              "        let mut raw = vec![0x00, 0x01, 0x01, 0x00, 0, 0, 0, 0];",
              "        raw.extend_from_slice(&[0u8; 19]);",
              "        assert_eq!(IoamPacket::parse(&raw), Err(IoamError::InvalidLength));",
              "    }",
          ])
          s = s[:insert_at] + tests + s[insert_at:]
          p.write_text(s)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test ioam --verbose
          cargo test --all-targets --verbose
          cargo build --release --verbose
          rm .github/workflows/one-shot-ioam-node-count.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ioam): reject truncated declared node records"
          git push origin HEAD:stage/ioam-node-count-validation

name: One-shot IPv6 PIO on-link fix

on:
  push:
    branches: [feat/ipv6-pio-onlink]

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused RFC 4861 PIO fix and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/stack.rs')
          s = path.read_text()

          def once(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, found {n}: {old!r}')
              s = s.replace(old, new, 1)

          once(
              "gateway: Option<Ipv6Address>,\n    deadline_ms: u64,",
              "gateway: Option<Ipv6Address>,\n    on_link: bool,\n    deadline_ms: u64,",
          )
          once(
              "gateway: Option<Ipv6Address>,\n        preferred_lifetime: u32,\n        valid_lifetime: u32,",
              "gateway: Option<Ipv6Address>,\n        on_link: bool,\n        preferred_lifetime: u32,\n        valid_lifetime: u32,",
          )
          once(
              "dad.gateway = gateway;\n            dad.preferred_until_ms = preferred_until_ms;",
              "dad.gateway = gateway;\n            // RFC 4861: L=0 makes no statement about on-link status.\n            dad.on_link |= on_link;\n            dad.preferred_until_ms = preferred_until_ms;",
          )
          once(
              "prefix_len: prefix_len.min(128),\n            gateway,\n            deadline_ms:",
              "prefix_len: prefix_len.min(128),\n            gateway,\n            on_link,\n            deadline_ms:",
          )
          once(
              "self.configure_ipv6_interface(dad.address, dad.prefix_len, gateway);\n                self.ipv6_slaac_lifetimes = Some(Ipv6SlaacLifetimes {",
              "self.configure_ipv6_interface(dad.address, dad.prefix_len, gateway);\n                // A configures the address; L independently declares the prefix on-link.\n                if !dad.on_link {\n                    self.ipv6_routing_table.remove_route(\n                        dad.address,\n                        dad.prefix_len,\n                        RouteSource::Connected,\n                    );\n                }\n                self.ipv6_slaac_lifetimes = Some(Ipv6SlaacLifetimes {",
          )
          once(
              "if self.config.ipv6 == Some(address) {\n                                            let old_valid = self",
              "if self.config.ipv6 == Some(address) {\n                                            // L=1 adds positive on-link knowledge; L=0 does not erase it.\n                                            if prefix.on_link {\n                                                self.ipv6_routing_table.add_route_from(\n                                                    address,\n                                                    prefix.prefix_length,\n                                                    None,\n                                                    \"eth0\",\n                                                    RouteSource::Connected,\n                                                );\n                                            }\n                                            let old_valid = self",
          )
          once(
              "prefix.prefix_length,\n                                            gateway,\n                                            prefix.preferred_lifetime,",
              "prefix.prefix_length,\n                                            gateway,\n                                            prefix.on_link,\n                                            prefix.preferred_lifetime,",
          )
          path.write_text(s)
          PY

          cat > tests/test_ipv6_ra_onlink.rs <<'RS'
          use std::str::FromStr;

          use toy_tcpip::ethernet::{ETHERTYPE_IPV6, EthernetFrame, MacAddress};
          use toy_tcpip::icmpv6::{
              Icmpv6Packet, PrefixInformationOption, ipv6_multicast_mac, link_local_address,
              slaac_address,
          };
          use toy_tcpip::ipv4::Ipv4Address;
          use toy_tcpip::ipv6::{Ipv6Address, Ipv6Packet, NEXT_HEADER_ICMPV6};
          use toy_tcpip::router::RouteSource;
          use toy_tcpip::stack::{IPV6_DAD_RETRANS_TIMER_MS, NetStack, NetStackConfig};

          fn ip6(text: &str) -> Ipv6Address {
              Ipv6Address::from_str(text).unwrap()
          }

          fn ra_frame(
              router_mac: MacAddress,
              prefix: PrefixInformationOption,
              router_lifetime: u16,
          ) -> Vec<u8> {
              let src = link_local_address(router_mac);
              let dst = Ipv6Address::LINK_LOCAL_ALL_NODES;
              let ra = Icmpv6Packet::build_router_advertisement(
                  src, dst, 64, router_lifetime, &[prefix], Some(router_mac),
              );
              let packet = Ipv6Packet::serialize(src, dst, NEXT_HEADER_ICMPV6, 255, &ra);
              EthernetFrame::serialize(
                  ipv6_multicast_mac(dst).unwrap(), router_mac, ETHERTYPE_IPV6, &packet,
              )
          }

          fn host(host_mac: MacAddress) -> NetStack {
              NetStack::new(NetStackConfig {
                  mac: host_mac,
                  ip: Ipv4Address::new(10, 0, 0, 2),
                  ipv6: None,
                  subnet_mask: 24,
                  gateway: None,
              })
          }

          #[test]
          fn autonomous_without_on_link_uses_default_router_for_same_prefix_peer() {
              let host_mac = MacAddress([0x00, 0x11, 0x22, 0x33, 0x44, 0x55]);
              let router_mac = MacAddress([0x02, 0, 0, 0, 1, 1]);
              let router = link_local_address(router_mac);
              let prefix = PrefixInformationOption::new(
                  ip6("2001:db8:44::"), 64, false, true, 3600, 1800,
              );
              let expected = slaac_address(prefix.prefix, 64, host_mac).unwrap();
              let mut stack = host(host_mac);

              let responses = stack.process_frame(&ra_frame(router_mac, prefix, 1800));
              assert_eq!(responses.len(), 1, "RA should start DAD");
              stack.step_timers(IPV6_DAD_RETRANS_TIMER_MS);
              assert_eq!(stack.config.ipv6, Some(expected));

              let peer = ip6("2001:db8:44::beef");
              let route = stack.ipv6_routing_table.lookup(peer).unwrap();
              assert_eq!(route.prefix_len, 0);
              assert_eq!(route.source, RouteSource::Static);
              assert_eq!(route.gateway, Some(router));

              let ping = stack.ping6(peer, 0x4861, 1, b"via-router").unwrap();
              let eth = EthernetFrame::parse(&ping).unwrap();
              assert_eq!(
                  eth.dst_mac, router_mac,
                  "A=1,L=0 same-prefix traffic must resolve the default router, not the peer"
              );
          }

          #[test]
          fn later_on_link_assertion_adds_route_and_l_zero_does_not_withdraw_it() {
              let host_mac = MacAddress([0x00, 0x11, 0x22, 0x33, 0x44, 0x55]);
              let router_mac = MacAddress([0x02, 0, 0, 0, 1, 1]);
              let mut stack = host(host_mac);
              let prefix_addr = ip6("2001:db8:55::");
              let peer = ip6("2001:db8:55::beef");
              let off_link = PrefixInformationOption::new(prefix_addr, 64, false, true, 3600, 1800);

              stack.process_frame(&ra_frame(router_mac, off_link, 1800));
              stack.step_timers(IPV6_DAD_RETRANS_TIMER_MS);
              assert_eq!(stack.ipv6_routing_table.lookup(peer).unwrap().prefix_len, 0);

              let on_link = PrefixInformationOption::new(prefix_addr, 64, true, true, 3600, 1800);
              stack.process_frame(&ra_frame(router_mac, on_link, 1800));
              let route = stack.ipv6_routing_table.lookup(peer).unwrap();
              assert_eq!(route.prefix_len, 64);
              assert_eq!(route.source, RouteSource::Connected);
              assert_eq!(route.gateway, None);

              stack.process_frame(&ra_frame(router_mac, off_link, 1800));
              let route = stack.ipv6_routing_table.lookup(peer).unwrap();
              assert_eq!(route.prefix_len, 64);
              assert_eq!(route.source, RouteSource::Connected);
          }
          RS

          cargo fmt --all
          cargo test --all-targets
          cargo build --release

          rm .github/workflows/one-shot-ipv6-pio-onlink.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ipv6): honor PIO on-link semantics'
          git push origin HEAD:feat/ipv6-pio-onlink

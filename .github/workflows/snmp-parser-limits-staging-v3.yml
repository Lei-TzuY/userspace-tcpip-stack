name: SNMP parser limits staging v3

on:
  push:
    branches:
      - work/snmp-parser-limits-staging
    paths:
      - .github/workflows/snmp-parser-limits-staging-v3.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Update parser-limit regression and clean staging files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/bin/snmp_agent.rs')
          s = p.read_text()
          old = '''    #[test]\n    fn oversized_community_is_dropped_after_bounded_parse() {\n        let mut mib = SnmpMib::new();\n        let long_community = "x".repeat(MAX_COMMUNITY_BYTES + 1);\n        let access = CommunityAccess::new(long_community.clone(), "private");\n        let request = SnmpMessage::build_get_request(&long_community, 19, &[SYS_NAME_OID]);\n        let packet = request.try_serialize().unwrap();\n\n        assert!(packet.len() <= MAX_REQUEST_BYTES);\n        assert_eq!(handle_datagram(&mut mib, &packet, &access).unwrap(), None);\n    }\n'''
          new = '''    #[test]\n    fn oversized_community_is_rejected_by_parser_before_agent_dispatch() {\n        let mut mib = SnmpMib::new();\n        let long_community = "x".repeat(MAX_COMMUNITY_BYTES + 1);\n        let access = CommunityAccess::new(long_community.clone(), "private");\n        let request = SnmpMessage::build_get_request(&long_community, 19, &[SYS_NAME_OID]);\n        let packet = request.try_serialize().unwrap();\n\n        assert!(packet.len() <= MAX_REQUEST_BYTES);\n        assert_eq!(\n            handle_datagram(&mut mib, &packet, &access),\n            Err(SnmpError::ResourceLimitExceeded("community length"))\n        );\n    }\n'''
          if old not in s:
              raise SystemExit('agent regression marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          rm -f staging-validation.txt
          git rm .github/workflows/snmp-parser-limits-staging-v3.yml
          git add -u
          git add src/bin/snmp_agent.rs
          git commit -m 'staging: align agent test with parser limits'
          git push origin HEAD:work/snmp-parser-limits-staging
      - name: Validate all targets and release build
        shell: bash
        run: |
          set +e
          cargo test --all-targets > /tmp/staging-validation.txt 2>&1
          status=$?
          if [ $status -eq 0 ]; then
            cargo build --release >> /tmp/staging-validation.txt 2>&1
            status=$?
          fi
          set -e
          if [ $status -ne 0 ]; then
            cp /tmp/staging-validation.txt staging-validation.txt
            git add staging-validation.txt
            git commit -m 'staging: capture validation failure'
            git push origin HEAD:work/snmp-parser-limits-staging
            exit $status
          fi

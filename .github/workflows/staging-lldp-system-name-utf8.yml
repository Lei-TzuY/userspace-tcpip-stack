name: staging-lldp-system-name-utf8

on:
  push:
    branches: [staging/lldp-system-name-utf8]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused fix and regression tests
        run: |
          echo '' | base64 -d | python3
          cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test --test test_lldp_system_name_utf8 --verbose
      - run: cargo test --all-targets --verbose
      - run: cargo build --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: validated-lldp-system-name-utf8
          path: |
            src/lldp.rs
            tests/test_lldp_system_name_utf8.rs

name: One-shot Diameter framing validation

on:
  push:
    branches: [stage/diameter-framing-validation]

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch, test, and clean branch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_diameter_framing.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --all-targets diameter --verbose
          cargo test --all-targets --verbose
          cargo build --release --verbose
          rm .github/scripts/patch_diameter_framing.py
          rm .github/workflows/one-shot-diameter-framing.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(diameter): reject malformed AVP framing'
          git push origin HEAD:stage/diameter-framing-validation

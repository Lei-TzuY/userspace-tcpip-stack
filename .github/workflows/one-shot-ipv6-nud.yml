name: One-shot IPv6 NUD lifecycle

on:
  push:
    branches:
      - feat/ipv6-nud-lifecycle

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply NUD lifecycle and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/icmpv6.rs',
              "pub const NDP_OPT_SRC_LINK_LAYER_ADDR: u8 = 1;\npub const NDP_OPT_TARGET_LINK_LAYER_ADDR: u8 = 2;\npub const NDP_OPT_PREFIX_INFORMATION: u8 = 3;\n",
              "pub const NDP_OPT_SRC_LINK_LAYER_ADDR: u8 = 1;\npub const NDP_OPT_TARGET_LINK_LAYER_ADDR: u8 = 2;\npub const NDP_OPT_PREFIX_INFORMATION: u8 = 3;\n\n/// RFC 4861 Neighbor Unreachability Detection defaults. The RFC randomizes\n/// Reachable Time around BaseReachableTime; this deterministic simulator uses\n/// the base 30-second value so timer-driven tests remain reproducible.\npub const NDP_REACHABLE_TIME_MS: u64 = 30_000;\npub const NDP_DELAY_FIRST_PROBE_TIME_MS: u64 = 5_000;\npub const NDP_RETRANS_TIMER_MS: u64 = 1_000;\npub const NDP_MAX_UNICAST_SOLICIT: u8 = 3;\n"
          )

          old = """/// Dynamic Neighbor Cache Table (IPv6 NDP equivalent of ARP Cache)
          #[derive(Debug, Clone, Default)]
          pub struct NdpTable {
              entries: HashMap<Ipv6Address, MacAddress>,
          }

          impl NdpTable {
              pub fn new() -> Self {
                  NdpTable {
                      entries: HashMap::new(),
                  }
              }

              pub fn insert(&mut self, ip: Ipv6Address, mac: MacAddress) {
                  self.entries.insert(ip, mac);
              }

              pub fn lookup(&self, ip: &Ipv6Address) -> Option<MacAddress> {
                  self.entries.get(ip).copied()
              }

              pub fn entries(&self) -> &HashMap<Ipv6Address, MacAddress> {
                  &self.entries
              }
          }
          """
          new = """/// RFC 4861 Neighbor Unreachability Detection state for a resolved neighbor.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum NeighborState {
              Reachable,
              Stale,
              Delay,
              Probe,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          struct NudMetadata {
              state: NeighborState,
              deadline_ms: Option<u64>,
              probes_sent: u8,
          }

          /// Dynamic Neighbor Cache Table (IPv6 NDP equivalent of ARP Cache).
          ///
          /// The MAC map remains separate from NUD metadata so the long-standing
          /// `insert`, `lookup`, and `entries` API stays source-compatible. Entries
          /// inserted directly are treated as static REACHABLE entries; protocol
          /// paths opt into timed NUD through `learn_stale`/`confirm_reachable`.
          #[derive(Debug, Clone, Default)]
          pub struct NdpTable {
              entries: HashMap<Ipv6Address, MacAddress>,
              nud: HashMap<Ipv6Address, NudMetadata>,
          }

          impl NdpTable {
              pub fn new() -> Self {
                  NdpTable {
                      entries: HashMap::new(),
                      nud: HashMap::new(),
                  }
              }

              /// Inserts a static/externally confirmed mapping that does not age.
              pub fn insert(&mut self, ip: Ipv6Address, mac: MacAddress) {
                  self.entries.insert(ip, mac);
                  self.nud.remove(&ip);
              }

              /// Learns link-layer information without reachability confirmation.
              /// RFC 4861 leaves an unchanged mapping's existing reachability state
              /// intact; a new or changed mapping becomes STALE.
              pub fn learn_stale(&mut self, ip: Ipv6Address, mac: MacAddress) {
                  if self.entries.get(&ip).is_some_and(|current| *current == mac) {
                      return;
                  }
                  self.mark_stale(ip, mac);
              }

              /// Installs a mapping explicitly in STALE state.
              pub fn mark_stale(&mut self, ip: Ipv6Address, mac: MacAddress) {
                  self.entries.insert(ip, mac);
                  self.nud.insert(
                      ip,
                      NudMetadata {
                          state: NeighborState::Stale,
                          deadline_ms: None,
                          probes_sent: 0,
                      },
                  );
              }

              /// Records positive reachability confirmation (for example a solicited NA).
              pub fn confirm_reachable(&mut self, ip: Ipv6Address, mac: MacAddress, now_ms: u64) {
                  self.entries.insert(ip, mac);
                  self.nud.insert(
                      ip,
                      NudMetadata {
                          state: NeighborState::Reachable,
                          deadline_ms: Some(now_ms.saturating_add(NDP_REACHABLE_TIME_MS)),
                          probes_sent: 0,
                      },
                  );
              }

              pub fn lookup(&self, ip: &Ipv6Address) -> Option<MacAddress> {
                  self.entries.get(ip).copied()
              }

              /// Looks up a mapping for actual transmission and performs the RFC 4861
              /// STALE -> DELAY transition on first use. DELAY/PROBE entries remain
              /// usable while NUD verifies reachability in parallel.
              pub fn lookup_for_transmit(
                  &mut self,
                  ip: &Ipv6Address,
                  now_ms: u64,
              ) -> Option<MacAddress> {
                  let mac = self.entries.get(ip).copied()?;
                  if let Some(meta) = self.nud.get_mut(ip) {
                      if meta.state == NeighborState::Reachable
                          && meta.deadline_ms.is_some_and(|deadline| now_ms >= deadline)
                      {
                          meta.state = NeighborState::Stale;
                          meta.deadline_ms = None;
                          meta.probes_sent = 0;
                      }
                      if meta.state == NeighborState::Stale {
                          meta.state = NeighborState::Delay;
                          meta.deadline_ms =
                              Some(now_ms.saturating_add(NDP_DELAY_FIRST_PROBE_TIME_MS));
                          meta.probes_sent = 0;
                      }
                  }
                  Some(mac)
              }

              pub fn state(&self, ip: &Ipv6Address) -> Option<NeighborState> {
                  self.entries.get(ip)?;
                  Some(
                      self.nud
                          .get(ip)
                          .map(|meta| meta.state)
                          .unwrap_or(NeighborState::Reachable),
                  )
              }

              /// Advances NUD timers and returns unicast NS probes as (target, MAC).
              /// Coarse simulator jumps emit at most one probe per neighbor per pump;
              /// the next retransmission is scheduled from the observed current time.
              pub fn step_nud(&mut self, now_ms: u64) -> Vec<(Ipv6Address, MacAddress)> {
                  let keys: Vec<Ipv6Address> = self.nud.keys().copied().collect();
                  let mut probes = Vec::new();
                  let mut remove = Vec::new();

                  for ip in keys {
                      let Some(meta) = self.nud.get_mut(&ip) else {
                          continue;
                      };
                      let Some(mac) = self.entries.get(&ip).copied() else {
                          remove.push(ip);
                          continue;
                      };

                      if meta.state == NeighborState::Reachable
                          && meta.deadline_ms.is_some_and(|deadline| now_ms >= deadline)
                      {
                          meta.state = NeighborState::Stale;
                          meta.deadline_ms = None;
                          meta.probes_sent = 0;
                          continue;
                      }

                      let due = meta.deadline_ms.is_some_and(|deadline| now_ms >= deadline);
                      match meta.state {
                          NeighborState::Delay if due => {
                              meta.state = NeighborState::Probe;
                              meta.probes_sent = 1;
                              meta.deadline_ms =
                                  Some(now_ms.saturating_add(NDP_RETRANS_TIMER_MS));
                              probes.push((ip, mac));
                          }
                          NeighborState::Probe if due => {
                              if meta.probes_sent < NDP_MAX_UNICAST_SOLICIT {
                                  meta.probes_sent = meta.probes_sent.saturating_add(1);
                                  meta.deadline_ms =
                                      Some(now_ms.saturating_add(NDP_RETRANS_TIMER_MS));
                                  probes.push((ip, mac));
                              } else {
                                  remove.push(ip);
                              }
                          }
                          _ => {}
                      }
                  }

                  for ip in remove {
                      self.entries.remove(&ip);
                      self.nud.remove(&ip);
                  }
                  probes
              }

              pub fn entries(&self) -> &HashMap<Ipv6Address, MacAddress> {
                  &self.entries
              }
          }
          """
          replace_once('src/icmpv6.rs', old, new)

          replace_once(
              'src/stack.rs',
              "        if let Some(dst_mac) = self.ndp_table.lookup(&next_hop) {\n",
              "        if let Some(dst_mac) = self\n            .ndp_table\n            .lookup_for_transmit(&next_hop, self.current_time_ms)\n        {\n"
          )

          replace_once(
              'src/stack.rs',
              "        // RFC 4861 Prefix List lifetimes are independent of SLAAC address\n",
              "        // RFC 4861 Neighbor Unreachability Detection probes STALE neighbors\n        // only after first use and a five-second DELAY period. PROBE uses unicast NS\n        // while the cached MAC remains usable; three unanswered probes remove it.\n        for (target, dst_mac) in self.ndp_table.step_nud(now_ms) {\n            if let Some(my_ip6) = self.config.ipv6 {\n                let ns = Icmpv6Packet::build_neighbor_solicitation(\n                    my_ip6,\n                    target,\n                    target,\n                    self.config.mac,\n                );\n                let packet =\n                    Ipv6Packet::serialize(my_ip6, target, NEXT_HEADER_ICMPV6, 255, &ns);\n                out_frames.push(EthernetFrame::serialize(\n                    dst_mac,\n                    self.config.mac,\n                    ETHERTYPE_IPV6,\n                    &packet,\n                ));\n            }\n        }\n\n        // RFC 4861 Prefix List lifetimes are independent of SLAAC address\n"
          )

          replace_once(
              'src/stack.rs',
              "                                    self.ndp_table.insert(ip6_pkt.header.src_ip, eth.src_mac);\n",
              "                                    self.ndp_table\n                                        .learn_stale(ip6_pkt.header.src_ip, eth.src_mac);\n"
          )

          replace_once(
              'src/stack.rs',
              "                                        self.ndp_table.insert(ip6_pkt.header.src_ip, eth.src_mac);\n",
              "                                        self.ndp_table\n                                            .learn_stale(ip6_pkt.header.src_ip, eth.src_mac);\n"
          )

          replace_once(
              'src/stack.rs',
              "                                // A validated NA resolves the advertised target, not an\n                                // arbitrary IPv6 source address carried by the frame.\n                                self.ndp_table.insert(target_ip6, eth.src_mac);\n",
              "                                // A solicited NA confirms forward reachability and starts\n                                // REACHABLE time. Unsolicited advertisements provide a mapping\n                                // but no reachability confirmation, so they remain STALE.\n                                let solicited = icmp6.payload[0] & 0x40 != 0;\n                                if solicited {\n                                    self.ndp_table.confirm_reachable(\n                                        target_ip6,\n                                        eth.src_mac,\n                                        self.current_time_ms,\n                                    );\n                                } else {\n                                    self.ndp_table.mark_stale(target_ip6, eth.src_mac);\n                                }\n"
          )
          PY

          cat > tests/test_ipv6_nud.rs <<'RS'
          use std::str::FromStr;

          use toy_tcpip::ethernet::{ETHERTYPE_IPV6, EthernetFrame, MacAddress};
          use toy_tcpip::icmpv6::{
              ICMPV6_TYPE_NEIGHBOR_SOLICIT, Icmpv6Packet, NDP_DELAY_FIRST_PROBE_TIME_MS,
              NDP_REACHABLE_TIME_MS, NDP_RETRANS_TIMER_MS, NdpTable, NeighborState,
              ipv6_multicast_mac,
          };
          use toy_tcpip::ipv4::Ipv4Address;
          use toy_tcpip::ipv6::{Ipv6Address, Ipv6Packet, NEXT_HEADER_ICMPV6};
          use toy_tcpip::stack::{NetStack, NetStackConfig};

          fn ip6(text: &str) -> Ipv6Address {
              Ipv6Address::from_str(text).unwrap()
          }

          fn mac(last: u8) -> MacAddress {
              MacAddress([0x02, 0, 0, 0, 0, last])
          }

          fn host(address: Ipv6Address, host_mac: MacAddress) -> NetStack {
              let mut stack = NetStack::new(NetStackConfig {
                  mac: host_mac,
                  ip: Ipv4Address::new(192, 0, 2, 2),
                  ipv6: None,
                  subnet_mask: 24,
                  gateway: None,
              });
              stack.configure_ipv6_interface(address, 64, None);
              stack
          }

          #[test]
          fn reachable_ages_to_stale_and_first_use_enters_delay() {
              let neighbor = ip6("2001:db8:1::2");
              let neighbor_mac = mac(2);
              let mut table = NdpTable::new();
              table.confirm_reachable(neighbor, neighbor_mac, 100);

              assert_eq!(table.state(&neighbor), Some(NeighborState::Reachable));
              assert!(table.step_nud(100 + NDP_REACHABLE_TIME_MS - 1).is_empty());
              assert_eq!(table.state(&neighbor), Some(NeighborState::Reachable));

              assert!(table.step_nud(100 + NDP_REACHABLE_TIME_MS).is_empty());
              assert_eq!(table.state(&neighbor), Some(NeighborState::Stale));
              assert_eq!(
                  table.lookup_for_transmit(&neighbor, 100 + NDP_REACHABLE_TIME_MS),
                  Some(neighbor_mac)
              );
              assert_eq!(table.state(&neighbor), Some(NeighborState::Delay));
          }

          #[test]
          fn delay_probes_three_times_then_removes_unreachable_neighbor() {
              let neighbor = ip6("2001:db8:2::2");
              let neighbor_mac = mac(3);
              let mut table = NdpTable::new();
              table.mark_stale(neighbor, neighbor_mac);
              assert_eq!(table.lookup_for_transmit(&neighbor, 0), Some(neighbor_mac));

              assert!(table.step_nud(NDP_DELAY_FIRST_PROBE_TIME_MS - 1).is_empty());
              assert_eq!(table.state(&neighbor), Some(NeighborState::Delay));

              let first = table.step_nud(NDP_DELAY_FIRST_PROBE_TIME_MS);
              assert_eq!(first, vec![(neighbor, neighbor_mac)]);
              assert_eq!(table.state(&neighbor), Some(NeighborState::Probe));

              let second = table.step_nud(NDP_DELAY_FIRST_PROBE_TIME_MS + NDP_RETRANS_TIMER_MS);
              assert_eq!(second, vec![(neighbor, neighbor_mac)]);
              let third = table.step_nud(
                  NDP_DELAY_FIRST_PROBE_TIME_MS + 2 * NDP_RETRANS_TIMER_MS,
              );
              assert_eq!(third, vec![(neighbor, neighbor_mac)]);

              assert!(table
                  .step_nud(NDP_DELAY_FIRST_PROBE_TIME_MS + 3 * NDP_RETRANS_TIMER_MS)
                  .is_empty());
              assert_eq!(table.lookup(&neighbor), None);
              assert_eq!(table.state(&neighbor), None);
          }

          #[test]
          fn solicited_na_confirms_reachability_and_cancels_probe_cycle() {
              let host_ip = ip6("2001:db8:3::1");
              let peer_ip = ip6("2001:db8:3::2");
              let host_mac = mac(0x31);
              let peer_mac = mac(0x32);
              let mut stack = host(host_ip, host_mac);
              stack.ndp_table.mark_stale(peer_ip, peer_mac);

              let data = stack.ping6(peer_ip, 0x4861, 1, b"nud").unwrap();
              assert_eq!(EthernetFrame::parse(&data).unwrap().dst_mac, peer_mac);
              assert_eq!(stack.ndp_table.state(&peer_ip), Some(NeighborState::Delay));

              let first_probe = stack.step_timers(NDP_DELAY_FIRST_PROBE_TIME_MS);
              assert_eq!(first_probe.len(), 1);
              assert_eq!(stack.ndp_table.state(&peer_ip), Some(NeighborState::Probe));

              let na = Icmpv6Packet::build_neighbor_advertisement(
                  peer_ip,
                  host_ip,
                  peer_ip,
                  peer_mac,
                  false,
                  true,
                  true,
              );
              let packet = Ipv6Packet::serialize(peer_ip, host_ip, NEXT_HEADER_ICMPV6, 255, &na);
              let frame = EthernetFrame::serialize(host_mac, peer_mac, ETHERTYPE_IPV6, &packet);
              assert!(stack.process_frame(&frame).is_empty());
              assert_eq!(stack.ndp_table.state(&peer_ip), Some(NeighborState::Reachable));

              assert!(stack
                  .step_timers(NDP_DELAY_FIRST_PROBE_TIME_MS + 2 * NDP_RETRANS_TIMER_MS)
                  .is_empty());
              assert_eq!(stack.ndp_table.state(&peer_ip), Some(NeighborState::Reachable));
          }

          #[test]
          fn netstack_emits_unicast_probes_then_falls_back_to_multicast_resolution() {
              let host_ip = ip6("2001:db8:4::1");
              let peer_ip = ip6("2001:db8:4::2");
              let host_mac = mac(0x41);
              let peer_mac = mac(0x42);
              let mut stack = host(host_ip, host_mac);
              stack.ndp_table.mark_stale(peer_ip, peer_mac);

              let data = stack.ping6(peer_ip, 0x600d, 1, b"first").unwrap();
              assert_eq!(EthernetFrame::parse(&data).unwrap().dst_mac, peer_mac);

              for now in [
                  NDP_DELAY_FIRST_PROBE_TIME_MS,
                  NDP_DELAY_FIRST_PROBE_TIME_MS + NDP_RETRANS_TIMER_MS,
                  NDP_DELAY_FIRST_PROBE_TIME_MS + 2 * NDP_RETRANS_TIMER_MS,
              ] {
                  let probes = stack.step_timers(now);
                  assert_eq!(probes.len(), 1);
                  let eth = EthernetFrame::parse(&probes[0]).unwrap();
                  assert_eq!(eth.dst_mac, peer_mac, "NUD PROBE must stay unicast");
                  let ip = Ipv6Packet::parse(eth.payload).unwrap();
                  assert_eq!(ip.header.src_ip, host_ip);
                  assert_eq!(ip.header.dst_ip, peer_ip);
                  assert_eq!(ip.header.hop_limit, 255);
                  let icmp = Icmpv6Packet::parse(
                      ip.header.src_ip,
                      ip.header.dst_ip,
                      ip.payload,
                      true,
                  )
                  .unwrap();
                  assert_eq!(icmp.msg_type, ICMPV6_TYPE_NEIGHBOR_SOLICIT);
              }

              assert!(stack
                  .step_timers(NDP_DELAY_FIRST_PROBE_TIME_MS + 3 * NDP_RETRANS_TIMER_MS)
                  .is_empty());
              assert_eq!(stack.ndp_table.lookup(&peer_ip), None);

              let resolution = stack.ping6(peer_ip, 0x600d, 2, b"retry").unwrap();
              let eth = EthernetFrame::parse(&resolution).unwrap();
              let solicited = peer_ip.solicited_node_multicast();
              assert_eq!(eth.dst_mac, ipv6_multicast_mac(solicited).unwrap());
              let ip = Ipv6Packet::parse(eth.payload).unwrap();
              assert_eq!(ip.header.dst_ip, solicited);
              assert_eq!(stack.pending_ndp_packets.get(&peer_ip).map(Vec::len), Some(1));
          }

          #[test]
          fn unsolicited_na_is_mapping_information_but_not_reachability_confirmation() {
              let host_ip = ip6("2001:db8:5::1");
              let peer_ip = ip6("2001:db8:5::2");
              let host_mac = mac(0x51);
              let peer_mac = mac(0x52);
              let mut stack = host(host_ip, host_mac);
              let dst = Ipv6Address::LINK_LOCAL_ALL_NODES;
              let na = Icmpv6Packet::build_neighbor_advertisement(
                  peer_ip,
                  dst,
                  peer_ip,
                  peer_mac,
                  false,
                  false,
                  true,
              );
              let packet = Ipv6Packet::serialize(peer_ip, dst, NEXT_HEADER_ICMPV6, 255, &na);
              let frame = EthernetFrame::serialize(
                  ipv6_multicast_mac(dst).unwrap(),
                  peer_mac,
                  ETHERTYPE_IPV6,
                  &packet,
              );

              assert!(stack.process_frame(&frame).is_empty());
              assert_eq!(stack.ndp_table.lookup(&peer_ip), Some(peer_mac));
              assert_eq!(stack.ndp_table.state(&peer_ip), Some(NeighborState::Stale));
          }
          RS

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --test test_ipv6_nud
          cargo test --test test_ipv6_ndp_learning
          cargo test --test test_ipv6_pmtud
          cargo test --all-targets
          cargo build --release
          git diff --check

          rm .github/workflows/one-shot-ipv6-nud.yml
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ipv6): add Neighbor Unreachability Detection lifecycle'
          git push origin HEAD:feat/ipv6-nud-lifecycle

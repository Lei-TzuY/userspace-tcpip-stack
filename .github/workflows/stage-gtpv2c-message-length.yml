name: Stage GTPv2-C message length

on:
  push:
    branches:
      - stage/gtpv2c-message-length

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/gtpv2c-message-length
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply staged source and regressions
        run: python scripts/stage_gtpv2c_message_length.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff
        run: git diff --check
      - name: Focused GTPv2-C length tests
        run: cargo test --test test_gtpv2c_message_length --verbose
      - name: Existing GTPv2-C tests
        run: cargo test gtpc_v2 --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/gtpc_v2.rs tests/test_gtpv2c_message_length.rs
          git commit -m "fix(gtpv2c): enforce declared message length"
          git push origin HEAD:stage/gtpv2c-message-length

name: One-shot NA TLLA processing

on:
  push:
    branches:
      - fix/ipv6-na-tlla-processing

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply RFC 4861 TLLA fix and verify
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/patch_na_tlla.py
          python3 /tmp/patch_na_tlla.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --test test_ipv6_nud
          cargo test --test test_ipv6_ndp_ingress_validation
          cargo test --all-targets
          cargo build --release
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(src/icmpv6.rs|src/stack.rs|tests/test_ipv6_nud.rs|\.github/workflows/one-shot-na-tlla\.yml)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changed files:"; echo "$unexpected"; exit 1; }
          rm .github/workflows/one-shot-na-tlla.yml
          git add -A
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git commit -m 'fix(ipv6): process NA Target Link-Layer Address'
          git push origin HEAD:fix/ipv6-na-tlla-processing

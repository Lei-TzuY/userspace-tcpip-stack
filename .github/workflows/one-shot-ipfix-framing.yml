name: One-shot IPFIX framing validation

on:
  push:
    branches:
      - stage/ipfix-framing-validation

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch, test, and clean branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ipfix.rs")
          text = path.read_text()

          old = (
              "        let length = u16::from_be_bytes([data[2], data[3]]) as usize;\n"
              "        if data.len() < length {\n"
              "            return None;\n"
              "        }\n"
          )
          new = (
              "        let length = u16::from_be_bytes([data[2], data[3]]) as usize;\n"
              "        if length < 16 || data.len() < length {\n"
              "            return None;\n"
              "        }\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one IPFIX message-length anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = (
              "            if set_len < 4 || offset + set_len > length {\n"
              "                break;\n"
              "            }\n"
          )
          new = (
              "            if set_len < 4 || offset + set_len > length {\n"
              "                return None;\n"
              "            }\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one IPFIX set-length anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = (
              "            offset += set_len;\n"
              "        }\n\n"
              "        Some(IpfixMessage {\n"
          )
          new = (
              "            offset += set_len;\n"
              "        }\n\n"
              "        if offset != length {\n"
              "            return None;\n"
              "        }\n\n"
              "        Some(IpfixMessage {\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one IPFIX final-boundary anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          anchor = (
              "        assert_eq!(parsed.flow_records[0].packets, 1540);\n"
              "    }\n"
              "}\n"
          )
          replacement = (
              "        assert_eq!(parsed.flow_records[0].packets, 1540);\n"
              "    }\n\n"
              "    fn empty_message() -> Vec<u8> {\n"
              "        IpfixMessage {\n"
              "            export_time: 1,\n"
              "            sequence_number: 2,\n"
              "            observation_domain_id: 3,\n"
              "            template: None,\n"
              "            flow_records: Vec::new(),\n"
              "        }\n"
              "        .serialize()\n"
              "    }\n\n"
              "    #[test]\n"
              "    fn test_ipfix_rejects_declared_length_below_header() {\n"
              "        let mut raw = empty_message();\n"
              "        raw[2..4].copy_from_slice(&15u16.to_be_bytes());\n"
              "        assert!(IpfixMessage::parse(&raw).is_none());\n"
              "    }\n\n"
              "    #[test]\n"
              "    fn test_ipfix_rejects_set_length_below_set_header() {\n"
              "        let mut raw = empty_message();\n"
              "        raw.extend_from_slice(&[0, 2, 0, 3]);\n"
              "        raw[2..4].copy_from_slice(&(raw.len() as u16).to_be_bytes());\n"
              "        assert!(IpfixMessage::parse(&raw).is_none());\n"
              "    }\n\n"
              "    #[test]\n"
              "    fn test_ipfix_rejects_set_overrun_past_message_length() {\n"
              "        let mut raw = empty_message();\n"
              "        raw.extend_from_slice(&[0, 2, 0, 8]);\n"
              "        raw[2..4].copy_from_slice(&(raw.len() as u16).to_be_bytes());\n"
              "        assert!(IpfixMessage::parse(&raw).is_none());\n"
              "    }\n\n"
              "    #[test]\n"
              "    fn test_ipfix_rejects_trailing_partial_set_header() {\n"
              "        let mut raw = empty_message();\n"
              "        raw.push(0);\n"
              "        raw[2..4].copy_from_slice(&(raw.len() as u16).to_be_bytes());\n"
              "        assert!(IpfixMessage::parse(&raw).is_none());\n"
              "    }\n\n"
              "    #[test]\n"
              "    fn test_ipfix_empty_message_remains_valid() {\n"
              "        let raw = empty_message();\n"
              "        let parsed = IpfixMessage::parse(&raw).unwrap();\n"
              "        assert!(parsed.template.is_none());\n"
              "        assert!(parsed.flow_records.is_empty());\n"
              "    }\n"
              "}\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one IPFIX test anchor, found {text.count(anchor)}")
          path.write_text(text.replace(anchor, replacement, 1))
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test ipfix --all-targets --verbose
          cargo test --all-targets --verbose
          cargo build --release --verbose

          rm .github/workflows/one-shot-ipfix-framing.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ipfix): reject malformed framing lengths'
          git push origin HEAD:stage/ipfix-framing-validation

name: One-shot PCEP framing validation

on:
  push:
    branches: [stage/pcep-framing-validation]

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch, test, and clean branch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pcep.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"anchor count {count}, expected 1: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "pub enum PcepError {\n    PacketTooShort(usize),\n    InvalidVersion(u8),\n    InvalidLength,\n}",
              "pub enum PcepError {\n    PacketTooShort(usize),\n    InvalidVersion(u8),\n    InvalidLength,\n    InvalidObjectFraming,\n}",
          )

          replace_once(
              "            PcepError::InvalidVersion(v) => write!(f, \"Unsupported PCEP version: {}\", v),\n            PcepError::InvalidLength => write!(f, \"Invalid PCEP length\"),",
              "            PcepError::InvalidVersion(v) => write!(f, \"Unsupported PCEP version: {}\", v),\n            PcepError::InvalidLength => write!(f, \"Invalid PCEP length\"),\n            PcepError::InvalidObjectFraming => write!(f, \"Malformed PCEP object framing\"),",
          )

          replace_once(
              "        let consumed = (obj_len + 3) & !3;\n        Some((obj, consumed.min(data.len())))",
              "        let consumed = (obj_len + 3) & !3;\n        if consumed > data.len() {\n            return None;\n        }\n        Some((obj, consumed))",
          )

          replace_once(
              "        if length > data.len() {\n            return Err(PcepError::InvalidLength);\n        }",
              "        if length < 4 || length > data.len() {\n            return Err(PcepError::InvalidLength);\n        }",
          )

          replace_once(
              "        while offset < length {\n            if let Some((obj, consumed)) = PcepObject::parse(&data[offset..length]) {\n                objects.push(obj);\n                offset += consumed;\n            } else {\n                break;\n            }\n        }",
              "        while offset < length {\n            let (obj, consumed) = PcepObject::parse(&data[offset..length])\n                .ok_or(PcepError::InvalidObjectFraming)?;\n            objects.push(obj);\n            offset += consumed;\n        }",
          )

          replace_once(
              "        assert_eq!(PCEP_PORT, 4189);\n    }\n}",
              "        assert_eq!(PCEP_PORT, 4189);\n    }\n\n    #[test]\n    fn test_pcep_rejects_message_length_below_header() {\n        let raw = [0x20, PCEP_MSG_KEEPALIVE, 0, 3];\n        assert_eq!(PcepMessage::parse(&raw), Err(PcepError::InvalidLength));\n    }\n\n    #[test]\n    fn test_pcep_rejects_trailing_partial_object_header() {\n        let raw = [0x20, PCEP_MSG_KEEPALIVE, 0, 5, 0xAA];\n        assert_eq!(\n            PcepMessage::parse(&raw),\n            Err(PcepError::InvalidObjectFraming)\n        );\n    }\n\n    #[test]\n    fn test_pcep_rejects_object_overrun() {\n        let raw = [\n            0x20, PCEP_MSG_KEEPALIVE, 0, 8, 99, 0x10, 0, 8,\n        ];\n        assert_eq!(\n            PcepMessage::parse(&raw),\n            Err(PcepError::InvalidObjectFraming)\n        );\n    }\n\n    #[test]\n    fn test_pcep_rejects_missing_object_alignment_padding() {\n        let raw = [\n            0x20, PCEP_MSG_KEEPALIVE, 0, 9, 99, 0x10, 0, 5, 0xAA,\n        ];\n        assert_eq!(\n            PcepMessage::parse(&raw),\n            Err(PcepError::InvalidObjectFraming)\n        );\n    }\n\n    #[test]\n    fn test_pcep_header_only_message_remains_valid() {\n        let raw = [0x20, PCEP_MSG_KEEPALIVE, 0, 4];\n        let parsed = PcepMessage::parse(&raw).unwrap();\n        assert_eq!(parsed.header.length, 4);\n        assert!(parsed.objects.is_empty());\n    }\n\n    #[test]\n    fn test_pcep_padded_raw_object_remains_valid() {\n        let raw = [\n            0x20, PCEP_MSG_KEEPALIVE, 0, 12, 99, 0x10, 0, 5, 0xAA, 0, 0, 0,\n        ];\n        let parsed = PcepMessage::parse(&raw).unwrap();\n        assert_eq!(parsed.objects.len(), 1);\n        assert_eq!(\n            parsed.objects[0],\n            PcepObject::Raw {\n                class_num: 99,\n                ot: 1,\n                body: vec![0xAA],\n            }\n        );\n    }\n}\n",
          )

          path.write_text(text)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --lib pcep::tests:: --verbose
          cargo test --all-targets --verbose
          cargo build --release --verbose
          rm .github/workflows/one-shot-pcep-framing.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(pcep): reject malformed object framing'
          git push origin HEAD:stage/pcep-framing-validation

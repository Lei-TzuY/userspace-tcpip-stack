name: Apply Graceful Restart Patch

on:
  push:
    branches: [ feat/bgp-graceful-restart ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bgp-graceful-restart
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply RFC 4724 patch
        run: python scripts/apply_graceful_restart.py
      - name: Verify focused BGP coverage
        run: cargo test --test test_bgp_graceful_restart --test test_bgp_capabilities --test test_bgp_session
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bgp_caps.rs src/bgp_router.rs tests/test_bgp_graceful_restart.rs
          git commit -m "feat(bgp): add RFC 4724 graceful restart helper mode"
          git push

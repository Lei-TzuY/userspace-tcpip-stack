name: Stage BGP minimum length guard

on:
  push:
    branches:
      - stage/bgp-minimum-length-guard

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply staged source and regressions
        run: python scripts/stage_bgp_minimum_length_guard.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff
        run: git diff --check
      - name: Focused BGP length tests
        run: cargo test --test test_bgp_length_validation --verbose
      - name: Existing BGP unit tests
        run: cargo test bgp::tests --lib --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bgp.rs tests/test_bgp_length_validation.rs
          git commit -m "fix(bgp): reject lengths below header"
          git push

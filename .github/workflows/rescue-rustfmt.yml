name: Rescue rustfmt baseline

on:
  push:
    branches:
      - fix/restore-ci-baseline

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out rescue branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/restore-ci-baseline
          fetch-depth: 0

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format repository
        run: cargo fmt --all

      - name: Verify formatting diff is mechanical
        shell: bash
        run: |
          git diff --check
          git status --short

      - name: Commit formatted baseline and remove rescue workflow
        shell: bash
        run: |
          git rm .github/workflows/rescue-rustfmt.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 1
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "fix(ci): restore rustfmt-clean baseline"
          git push origin HEAD:fix/restore-ci-baseline

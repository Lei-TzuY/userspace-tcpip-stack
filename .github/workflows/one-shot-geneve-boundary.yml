name: One-shot Geneve option boundary

on:
  push:
    branches:
      - stage/geneve-option-boundary

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch, test, and clean branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/geneve.rs")
          text = path.read_text()

          old = (
              "            if offset + 4 + opt_data_bytes > opt_end {\n"
              "                break;\n"
              "            }\n"
          )
          new = (
              "            if offset + 4 + opt_data_bytes > opt_end {\n"
              "                return Err(GeneveError::OptionLengthMismatch(\n"
              "                    offset + 4 + opt_data_bytes,\n"
              "                    opt_end,\n"
              "                ));\n"
              "            }\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one Geneve option-overrun anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)

          anchor = (
              "        assert_eq!(parsed.options[0].class, 0x0100);\n"
              "        assert_eq!(parsed.options[0].data, vec![0x11, 0x22, 0x33, 0x44]);\n"
              "    }\n"
              "}\n"
          )
          replacement = (
              "        assert_eq!(parsed.options[0].class, 0x0100);\n"
              "        assert_eq!(parsed.options[0].data, vec![0x11, 0x22, 0x33, 0x44]);\n"
              "    }\n\n"
              "    #[test]\n"
              "    fn test_geneve_rejects_option_data_past_declared_option_area() {\n"
              "        let mut raw = vec![0u8; GENEVE_BASE_HEADER_LEN + 4];\n"
              "        raw[0] = 1; // Opt Len = one 4-byte option header.\n"
              "        raw[8..10].copy_from_slice(&0x0100u16.to_be_bytes());\n"
              "        raw[10] = 1;\n"
              "        raw[11] = 1; // Option itself claims another 4 data bytes.\n\n"
              "        assert_eq!(\n"
              "            GenevePacket::parse(&raw),\n"
              "            Err(GeneveError::OptionLengthMismatch(16, 12))\n"
              "        );\n"
              "    }\n\n"
              "    #[test]\n"
              "    fn test_geneve_zero_data_option_remains_valid() {\n"
              "        let mut raw = vec![0u8; GENEVE_BASE_HEADER_LEN + 4 + 3];\n"
              "        raw[0] = 1; // Opt Len = one 4-byte option header.\n"
              "        raw[8..10].copy_from_slice(&0x0100u16.to_be_bytes());\n"
              "        raw[10] = 7;\n"
              "        raw[11] = 0; // Zero option-data words is legal.\n"
              "        raw[12..].copy_from_slice(&[0xaa, 0xbb, 0xcc]);\n\n"
              "        let parsed = GenevePacket::parse(&raw).unwrap();\n"
              "        assert_eq!(parsed.options.len(), 1);\n"
              "        assert_eq!(parsed.options[0].class, 0x0100);\n"
              "        assert_eq!(parsed.options[0].opt_type, 7);\n"
              "        assert!(parsed.options[0].data.is_empty());\n"
              "        assert_eq!(parsed.payload, vec![0xaa, 0xbb, 0xcc]);\n"
              "    }\n"
              "}\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one Geneve test anchor, found {text.count(anchor)}")
          path.write_text(text.replace(anchor, replacement, 1))
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test geneve --all-targets --verbose
          cargo test --all-targets --verbose
          cargo build --release --verbose

          rm .github/workflows/one-shot-geneve-boundary.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(geneve): reject option length overruns'
          git push origin HEAD:stage/geneve-option-boundary

name: Stage MQTT CONNECT client ID

on:
  push:
    branches: [ stage/mqtt-connect-client-id ]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply staged patch
        run: python scripts/stage_mqtt_connect_client_id.py
      - name: Format
        run: cargo fmt --all
      - name: Diff check
        run: git diff --check
      - name: Focused regressions
        run: cargo test --test test_mqtt_connect_client_id --verbose
      - name: Existing CONNECT regressions
        run: cargo test --test test_mqtt_connect_variable_header --verbose
      - name: All targets
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated product files
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/mqtt.rs tests/test_mqtt_connect_client_id.rs
          git commit -m "stage: validated mqtt connect client id [skip ci]"
          git push origin HEAD:stage/mqtt-connect-client-id

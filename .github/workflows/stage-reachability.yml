name: Stage reachable default-router selection

on:
  push:
    branches: [feat/ipv6-reachable-default-router-selection]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ipv6-reachable-default-router-selection
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply implementation and tests
        run: python scripts/stage_reachability.py
      - name: Format
        run: cargo fmt --all
      - name: Focused tests
        run: cargo test --test test_ipv6_default_router_list --verbose
      - name: Full tests
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Remove staging helpers
        run: |
          rm scripts/stage_reachability.py
          rm .github/workflows/stage-reachability.yml
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(ipv6): prefer reachable default routers"
          git push origin HEAD:feat/ipv6-reachable-default-router-selection

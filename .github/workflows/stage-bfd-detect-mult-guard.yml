name: Stage BFD Detect Mult guard

on:
  push:
    branches: [stage/bfd-detect-mult-guard]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply staged source and regressions
        run: python scripts/stage_bfd_detect_mult_guard.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff
        run: git diff --check
      - name: Focused BFD validation tests
        run: cargo test --test test_bfd_validation --verbose
      - name: Existing BFD unit tests
        run: cargo test bfd::tests --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bfd.rs tests/test_bfd_validation.rs
          git commit -m "fix(bfd): reject zero detect multiplier"
          git push origin HEAD:stage/bfd-detect-mult-guard

name: Stage RFC 4191 default RIO

on:
  push:
    branches: [ stage/rfc4191-rio-default ]
    paths:
      - scripts/stage_rio_default.py
      - .github/workflows/stage-rio-default.yml

permissions:
  contents: write

jobs:
  build-clean-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Build clean implementation branch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/stage_rio_default.py /tmp/stage_rio_default.py
          git fetch origin main
          git checkout -B feat/rfc4191-rio-default origin/main
          python /tmp/stage_rio_default.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --test test_ipv6_rio_routing --verbose
          cargo test --all-targets --verbose
          cargo build --release --verbose
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/stack.rs tests/test_ipv6_rio_routing.rs
          git commit -m "feat(ipv6): integrate RFC 4191 default RIO routes"
          git push --force origin feat/rfc4191-rio-default

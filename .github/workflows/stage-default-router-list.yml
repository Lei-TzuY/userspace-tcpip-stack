name: Stage IPv6 Default Router List

on:
  push:
    branches: [ feat/ipv6-default-router-list ]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply implementation
        run: python tools/apply_default_router_list.py
      - name: Format
        run: cargo fmt --all
      - name: Focused tests
        run: cargo test --test test_ipv6_default_router_list --verbose
      - name: Full tests
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Remove staging helpers
        run: |
          rm tools/apply_default_router_list.py
          rm .github/workflows/stage-default-router-list.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ipv6): add default router list failover"
          git push origin HEAD:feat/ipv6-default-router-list

name: One-shot BGP-LS TLV framing

on:
  push:
    branches:
      - stage/bgp-ls-tlv-framing

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/bgp-ls-tlv-framing
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch, test, and clean branch
        shell: bash
        run: |
          set -euo pipefail
          python .github/bgp_ls_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test bgp_ls --verbose
          cargo test --all-targets --verbose
          cargo build --release --verbose
          git diff --check
          rm .github/workflows/one-shot-bgp-ls-framing.yml .github/bgp_ls_patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(bgp-ls): reject malformed TLV framing'
          git push origin HEAD:stage/bgp-ls-tlv-framing

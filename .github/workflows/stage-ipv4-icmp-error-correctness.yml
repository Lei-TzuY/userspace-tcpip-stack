name: Stage IPv4 ICMP error correctness

on:
  push:
    branches:
      - stage/ipv4-icmp-error-correctness

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply staged source and regression changes
        run: python scripts/stage_ipv4_icmp_error_correctness.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff
        run: git diff --check
      - name: Focused IPv4 ICMP error tests
        run: cargo test --test test_ipv4_icmp_error_suppression --verbose
      - name: Existing lab regressions
        run: cargo test --test test_lab_e2e --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git rm -f scripts/stage_ipv4_icmp_error_correctness.py .github/workflows/stage-ipv4-icmp-error-correctness.yml
          git add src/lab.rs tests/test_ipv4_icmp_error_suppression.rs
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "fix(ipv4): enforce ICMP error suppression and report no-route"
          git push origin HEAD:stage/ipv4-icmp-error-correctness

name: Stage IPv6 NA Router Flag

on:
  push:
    branches:
      - fix/ipv6-na-router-flag

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply implementation and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/stack.rs')
          text = path.read_text()
          old = '''                                if let Some(current_mac) = cached_mac {
                                    if advertised_mac.is_some_and(|mac| mac != current_mac)
                                        && !override_flag
                                    {
                                        // With Override clear, a differing TLLA cannot replace
                                        // the cached address. Only a REACHABLE dynamic entry is
                                        // demoted to STALE; every other cache field is preserved.
                                        self.ndp_table.demote_reachable_preserving_mac(target_ip6);
                                    } else {
                                        // With Override set, the advertised TLLA wins. If the
                                        // option is absent, RFC 4861 explicitly keeps the cached
                                        // link-layer address while still allowing a solicited NA
                                        // to confirm reachability.
                                        let selected_mac = advertised_mac.unwrap_or(current_mac);
                                        let address_changed = selected_mac != current_mac;
                                        if solicited {
                                            self.ndp_table.confirm_reachable(
                                                target_ip6,
                                                selected_mac,
                                                self.current_time_ms,
                                            );
                                        } else if address_changed {
                                            self.ndp_table.mark_stale(target_ip6, selected_mac);
                                        }
                                    }
                                } else if resolving {
'''
          new = '''                                if let Some(current_mac) = cached_mac {
                                    if advertised_mac.is_some_and(|mac| mac != current_mac)
                                        && !override_flag
                                    {
                                        // With Override clear, a differing TLLA cannot replace
                                        // the cached address. Only a REACHABLE dynamic entry is
                                        // demoted to STALE; every other cache field is preserved.
                                        self.ndp_table.demote_reachable_preserving_mac(target_ip6);
                                    } else {
                                        // With Override set, the advertised TLLA wins. If the
                                        // option is absent, RFC 4861 explicitly keeps the cached
                                        // link-layer address while still allowing a solicited NA
                                        // to confirm reachability.
                                        let selected_mac = advertised_mac.unwrap_or(current_mac);
                                        let address_changed = selected_mac != current_mac;
                                        if solicited {
                                            self.ndp_table.confirm_reachable(
                                                target_ip6,
                                                selected_mac,
                                                self.current_time_ms,
                                            );
                                        } else if address_changed {
                                            self.ndp_table.mark_stale(target_ip6, selected_mac);
                                        }
                                    }

                                    // RFC 4861 section 7.2.5: when a cached neighbor that is
                                    // currently our default router advertises Router=0, it must
                                    // be removed from the Default Router List. This stack models
                                    // a single SLAAC default router, so withdraw only that exact
                                    // target; address/prefix lifetimes remain unaffected.
                                    let is_router = icmp6.payload[0] & 0x80 != 0;
                                    if !is_router {
                                        self.refresh_slaac_default_router(target_ip6, 0);
                                    }
                                } else if resolving {
'''
          if old not in text:
              raise SystemExit('target stack.rs block not found')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/test_ipv6_na_router_flag.rs')
          test.write_text(r'''use std::str::FromStr;

use toy_tcpip::ethernet::{ETHERTYPE_IPV6, EthernetFrame, MacAddress};
use toy_tcpip::icmpv6::{
    Icmpv6Packet, PrefixInformationOption, ipv6_multicast_mac, link_local_address,
};
use toy_tcpip::ipv4::Ipv4Address;
use toy_tcpip::ipv6::{Ipv6Address, Ipv6Packet, NEXT_HEADER_ICMPV6};
use toy_tcpip::stack::{IPV6_DAD_RETRANS_TIMER_MS, NetStack, NetStackConfig};

fn ip6(text: &str) -> Ipv6Address {
    Ipv6Address::from_str(text).unwrap()
}

fn configured_stack(host_mac: MacAddress, router_mac: MacAddress) -> (NetStack, Ipv6Address) {
    let mut stack = NetStack::new(NetStackConfig {
        mac: host_mac,
        ip: Ipv4Address::new(192, 0, 2, 10),
        ipv6: None,
        subnet_mask: 24,
        gateway: None,
    });
    let prefix = ip6("2001:db8:55::");
    let router_ip = link_local_address(router_mac);
    let dst = Ipv6Address::LINK_LOCAL_ALL_NODES;
    let pio = PrefixInformationOption::new(prefix, 64, true, true, 3_600, 1_800);
    let ra = Icmpv6Packet::build_router_advertisement(
        router_ip,
        dst,
        64,
        1_800,
        &[pio],
        Some(router_mac),
    );
    let packet = Ipv6Packet::serialize(router_ip, dst, NEXT_HEADER_ICMPV6, 255, &ra);
    let frame = EthernetFrame::serialize(
        ipv6_multicast_mac(dst).unwrap(),
        router_mac,
        ETHERTYPE_IPV6,
        &packet,
    );
    assert_eq!(stack.process_frame(&frame).len(), 1);
    stack.step_timers(IPV6_DAD_RETRANS_TIMER_MS);
    assert_eq!(stack.ipv6_gateway(), Some(router_ip));
    (stack, router_ip)
}

fn router_na(
    host_mac: MacAddress,
    host_ip: Ipv6Address,
    router_mac: MacAddress,
    router_ip: Ipv6Address,
    is_router: bool,
) -> Vec<u8> {
    let na = Icmpv6Packet::build_neighbor_advertisement(
        router_ip,
        host_ip,
        router_ip,
        router_mac,
        is_router,
        true,
        true,
    );
    let packet = Ipv6Packet::serialize(router_ip, host_ip, NEXT_HEADER_ICMPV6, 255, &na);
    EthernetFrame::serialize(host_mac, router_mac, ETHERTYPE_IPV6, &packet)
}

#[test]
fn na_router_flag_clear_withdraws_current_default_router() {
    let host_mac = MacAddress([0x00, 0x55, 0x22, 0x33, 0x44, 0x01]);
    let router_mac = MacAddress([0x02, 0, 0, 0, 0x55, 0x01]);
    let (mut stack, router_ip) = configured_stack(host_mac, router_mac);
    let host_ip = stack.config.ipv6.unwrap();

    assert!(stack
        .process_frame(&router_na(host_mac, host_ip, router_mac, router_ip, false))
        .is_empty());

    assert_eq!(
        stack.ipv6_gateway(),
        None,
        "Router=0 must remove the advertising neighbor from the Default Router List"
    );
    assert_eq!(stack.config.ipv6, Some(host_ip), "SLAAC address remains valid");
    assert_eq!(stack.ndp_table.lookup(&router_ip), Some(router_mac));
}

#[test]
fn na_router_flag_set_preserves_current_default_router() {
    let host_mac = MacAddress([0x00, 0x56, 0x22, 0x33, 0x44, 0x01]);
    let router_mac = MacAddress([0x02, 0, 0, 0, 0x56, 0x01]);
    let (mut stack, router_ip) = configured_stack(host_mac, router_mac);
    let host_ip = stack.config.ipv6.unwrap();

    assert!(stack
        .process_frame(&router_na(host_mac, host_ip, router_mac, router_ip, true))
        .is_empty());

    assert_eq!(stack.ipv6_gateway(), Some(router_ip));
}
''')
          PY
          cargo fmt --all
      - name: Focused regression
        run: cargo test --test test_ipv6_na_router_flag --verbose
      - name: Full test suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release
      - name: Commit validated change
        shell: bash
        run: |
          rm .github/workflows/stage-ipv6-na-router-flag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stack.rs tests/test_ipv6_na_router_flag.rs .github/workflows/stage-ipv6-na-router-flag.yml
          git commit -m "fix(ipv6): honor NA Router flag for default router"
          git push origin HEAD:fix/ipv6-na-router-flag

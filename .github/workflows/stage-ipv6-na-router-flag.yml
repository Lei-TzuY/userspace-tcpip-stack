name: Stage IPv6 NA Router Flag

on:
  push:
    branches: [fix/ipv6-na-router-flag]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python3 .github/stage_ipv6_na_router_flag.py
      - name: Format
        run: cargo fmt --all
      - name: Focused regression
        run: cargo test --test test_ipv6_na_router_flag --verbose
      - name: Full test suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated change
        shell: bash
        run: |
          rm .github/workflows/stage-ipv6-na-router-flag.yml
          rm .github/stage_ipv6_na_router_flag.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ipv6): honor NA Router flag for default router"
          git push origin HEAD:fix/ipv6-na-router-flag

name: Format SNMP provenance candidate

on:
  push:
    branches:
      - tool/snmp-fuzz-target-provenance

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tool/snmp-fuzz-target-provenance
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/promote_snmp_fuzz_artifact.rs
          git commit -m "chore: apply rustfmt"
          git push origin HEAD:tool/snmp-fuzz-target-provenance

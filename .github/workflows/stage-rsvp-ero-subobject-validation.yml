name: Stage RSVP ERO subobject validation

on:
  push:
    branches:
      - stage/rsvp-ero-subobject-validation

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply staged source and regressions
        run: python scripts/stage_rsvp_ero_subobject_validation.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff
        run: git diff --check
      - name: Focused RSVP ERO tests
        run: cargo test --test test_rsvp_ero_subobject_validation --verbose
      - name: Existing RSVP tests
        run: cargo test --lib rsvp:: --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/rsvp.rs tests/test_rsvp_ero_subobject_validation.rs
          git commit -m "fix(rsvp): validate ERO subobject framing"
          git push origin HEAD:stage/rsvp-ero-subobject-validation

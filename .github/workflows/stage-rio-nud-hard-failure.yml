name: Stage RIO NUD hard failure

on:
  push:
    branches:
      - stage/rio-nud-hard-failure

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply implementation
        run: python scripts/stage_rio_nud_hard_failure.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Focused regression
        run: cargo test --test test_ipv6_rio_routing --verbose
      - name: Full tests
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated implementation tree
        run: |
          rm scripts/stage_rio_nud_hard_failure.py
          rm .github/workflows/stage-rio-nud-hard-failure.yml
          git add src/stack.rs tests/test_ipv6_rio_routing.rs scripts/stage_rio_nud_hard_failure.py .github/workflows/stage-rio-nud-hard-failure.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "fix(ipv6): fail over NUD-unreachable RIO router"
          git push origin HEAD:stage/rio-nud-hard-failure

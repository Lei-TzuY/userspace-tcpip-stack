name: Stage IPv6 router preference

on:
  push:
    branches:
      - feat/ipv6-router-preference

permissions:
  contents: write

jobs:
  stage-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ipv6-router-preference
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply implementation
        run: |
          python3 scripts/stage_ipv6_router_preference.py
          python3 scripts/fix_ipv6_router_preference_stage.py

      - name: Format
        run: cargo fmt --all

      - name: Focused regression suite
        run: cargo test --test test_ipv6_default_router_list --verbose

      - name: Full test suite
        run: cargo test --all-targets --verbose

      - name: Release build
        run: cargo build --release --verbose

      - name: Remove staging helpers and push validated implementation
        shell: bash
        run: |
          rm scripts/stage_ipv6_router_preference.py
          rm scripts/fix_ipv6_router_preference_stage.py
          rm .github/workflows/stage-ipv6-router-preference.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ipv6): honor RFC 4191 router preference"
          git push origin HEAD:feat/ipv6-router-preference

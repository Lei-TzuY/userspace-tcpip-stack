name: Staging MQTT CONNECT payload

on:
  push:
    branches:
      - staging/mqtt-connect-payload-framing

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python scripts/staging_mqtt_connect_payload.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test all targets
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mqtt.rs tests/test_mqtt_connect_payload.rs
          git diff --cached --quiet || git commit -m "staging: validate MQTT CONNECT payload framing"
          git push

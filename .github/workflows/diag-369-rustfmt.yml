name: diag-369-rustfmt
on:
  push:
    branches: [diag/369-rustfmt]
permissions:
  contents: read
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-369
          path: src/bin/netstack_ipv4_fragment_ecmp_arp.rs

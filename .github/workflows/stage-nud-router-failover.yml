name: Stage NUD default-router failover

on:
  push:
    branches:
      - feat/ipv6-nud-router-failover-v2

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python3 tools/apply_ipv6_nud_router_failover.py
      - name: Format
        run: cargo fmt --all
      - name: Focused regression
        run: cargo test --test test_ipv6_default_router_list --verbose
      - name: Full test suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Finalize clean implementation commit
        run: |
          rm tools/apply_ipv6_nud_router_failover.py
          rm .github/workflows/stage-nud-router-failover.yml
          rm -f .nud-failover-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ipv6): fail over NUD-unreachable default router"
          git push origin HEAD:feat/ipv6-nud-router-failover-v2

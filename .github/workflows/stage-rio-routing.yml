name: stage-rio-routing
on:
  push:
    branches: [staging/rfc4191-rio-routing]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply implementation
        run: |
          python tools/stage_rio_routing.py
          sed -i 's/userspace_tcpip_stack/toy_tcpip/g' tests/test_ipv6_rio_routing.rs
          sed -i 's/process_ethernet_frame/process_frame/g' tests/test_ipv6_rio_routing.rs
          python - <<'PY'
          from pathlib import Path
          p = Path('src/stack.rs')
          s = p.read_text()
          needle = "        self.ipv6_default_routers.clear();\n        self.ipv6_dad = None;"
          replacement = "        self.ipv6_default_routers.clear();\n        self.ipv6_ra_routes.clear();\n        self.ipv6_routing_table.remove_all_from(RouteSource::RaRoute);\n        self.ipv6_dad = None;"
          assert needle in s
          p.write_text(s.replace(needle, replacement, 1))
          PY
          cat >> tests/test_ipv6_rio_routing.rs <<'RS'

          #[test]
          fn clearing_ipv6_interface_removes_learned_rio_routes() {
              let mut stack = stack();
              let router = ip("fe80::1");
              let prefix = ip("2001:db8:55::");
              stack.process_frame(&ra_frame(
                  router,
                  RouteInformationOption::new(prefix, 64, RouterPreference::Medium, 60),
              ));
              assert!(stack.ipv6_routing_table.find_exact(prefix, 64).is_some());

              stack.clear_ipv6_interface();
              assert!(stack.ipv6_routing_table.find_exact(prefix, 64).is_none());
              assert!(stack.ipv6_routing_table.routes_from(RouteSource::RaRoute).is_empty());
          }
          RS
      - name: Format
        run: cargo fmt --all
      - name: Focused tests
        run: cargo test --test test_ipv6_rio_routing --verbose
      - name: Full tests
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated tree
        run: |
          rm -f tools/stage_rio_routing.py .github/workflows/stage-rio-routing.yml
          git config user.name 'Lei-TzuY'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ipv6): install RFC 4191 RIO routes'
          git push origin HEAD:staging/rfc4191-rio-routing

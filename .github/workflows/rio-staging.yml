name: RFC4191 RIO staging

on:
  push:
    branches:
      - stage/rfc4191-rio

permissions:
  contents: write

jobs:
  stage-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/rfc4191-rio
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply implementation
        run: python scripts/rio_staging.py
      - name: Format
        run: cargo fmt --all
      - name: Focused tests
        run: cargo test icmpv6::tests::test_rfc4191 --verbose
      - name: Full tests
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated implementation tree
        shell: bash
        run: |
          rm .github/workflows/rio-staging.yml scripts/rio_staging.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/icmpv6.rs .github/workflows/rio-staging.yml scripts/rio_staging.py
          git commit -m "feat(ipv6): add RFC 4191 route information option primitives"
          git push origin HEAD:stage/rfc4191-rio

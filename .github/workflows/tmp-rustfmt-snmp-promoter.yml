name: Temporary Rustfmt SNMP Promoter

on:
  push:
    branches:
      - tool/snmp-fuzz-artifact-layout-validation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tool/snmp-fuzz-artifact-layout-validation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/bin/promote_snmp_fuzz_artifact.rs
          git commit -m "chore: apply canonical rustfmt"
          git push origin HEAD:tool/snmp-fuzz-artifact-layout-validation

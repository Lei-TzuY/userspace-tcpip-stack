name: One-shot router-side IPv6 NUD lifecycle

on:
  push:
    branches:
      - feat/ipv6-router-nud-lifecycle

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch router NUD lifecycle, test, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lab.rs')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''        let mut out = Vec::new();
                  if self.sockets.is_none() {
                      return out;
                  }

                  // Local MAC learning becomes EVPN origination before the speaker runs, so
          ''',
              '''        let mut out = Vec::new();

                  // RFC 4861 NUD is a forwarding-plane timer and must run even when this
                  // router has no socket/control-plane runtime enabled.
                  let mut interface_names: Vec<String> = self.ndp_tables.keys().cloned().collect();
                  interface_names.sort();
                  for interface_name in interface_names {
                      let mut probes = self
                          .ndp_tables
                          .get_mut(&interface_name)
                          .map(|table| table.step_nud(now_ms))
                          .unwrap_or_default();
                      probes.sort_by_key(|(target, _)| target.0);
                      if probes.is_empty() {
                          continue;
                      }

                      let Some(interface) = self
                          .interfaces
                          .iter()
                          .find(|iface| iface.name == interface_name)
                          .cloned()
                      else {
                          continue;
                      };
                      let Some((source_ip, _)) = interface.ipv6 else {
                          continue;
                      };

                      for (target, dst_mac) in probes {
                          let ns = Icmpv6Packet::build_neighbor_solicitation(
                              source_ip,
                              target,
                              target,
                              interface.mac,
                          );
                          let packet = Ipv6Packet::serialize(
                              source_ip,
                              target,
                              NEXT_HEADER_ICMPV6,
                              255,
                              &ns,
                          );
                          out.push((
                              interface.link_name.clone(),
                              EthernetFrame::serialize(
                                  dst_mac,
                                  interface.mac,
                                  ETHERTYPE_IPV6,
                                  &packet,
                              ),
                          ));
                      }
                  }

                  if self.sockets.is_none() {
                      return out;
                  }

                  // Local MAC learning becomes EVPN origination before the speaker runs, so
          ''',
              'router step_timers NUD insertion',
          )

          helper_marker = '''    pub fn process_incoming_frame(
          '''
          if text.count(helper_marker) != 1:
              raise SystemExit('process_incoming_frame marker not unique')
          helper = '''    fn release_pending_ipv6_transit_for_neighbor(
                  &mut self,
                  interface: &RouterInterface,
                  neighbor_ip: Ipv6Address,
                  dst_mac: MacAddress,
                  out: &mut Vec<(String, Vec<u8>)>,
              ) {
                  let pending_key = (interface.name.clone(), neighbor_ip);
                  if let Some(queued) = self.pending_ipv6_transit_packets.remove(&pending_key) {
                      for packet in queued {
                          out.push((
                              interface.link_name.clone(),
                              EthernetFrame::serialize(
                                  dst_mac,
                                  interface.mac,
                                  ETHERTYPE_IPV6,
                                  &packet,
                              ),
                          ));
                      }
                  }
              }

          '''
          text = text.replace(helper_marker, helper + helper_marker, 1)

          start_marker = '''                    let neighbor_ip = match icmp6.msg_type {
          '''
          end_marker = '''
                  }

                  let own_destination ='''
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('router NDP learning start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('router NDP learning end marker not found')

          new_learning = '''                    match icmp6.msg_type {
                          ICMPV6_TYPE_ROUTER_SOLICIT
                              if icmp6.is_valid_router_solicitation(
                                  ip6_pkt.header.src_ip,
                                  ip6_pkt.header.hop_limit,
                              ) && !ip6_pkt.header.src_ip.is_unspecified() =>
                          {
                              let neighbor_ip = ip6_pkt.header.src_ip;
                              self.ndp_tables
                                  .entry(ingress_iface.name.clone())
                                  .or_default()
                                  .learn_stale(neighbor_ip, eth.src_mac);
                              self.release_pending_ipv6_transit_for_neighbor(
                                  &ingress_iface,
                                  neighbor_ip,
                                  eth.src_mac,
                                  &mut out_transmissions,
                              );
                          }
                          ICMPV6_TYPE_NEIGHBOR_SOLICIT => {
                              if icmp6
                                  .validated_neighbor_solicitation_target(
                                      ip6_pkt.header.src_ip,
                                      ip6_pkt.header.dst_ip,
                                      ip6_pkt.header.hop_limit,
                                  )
                                  .is_some()
                                  && !ip6_pkt.header.src_ip.is_unspecified()
                              {
                                  let neighbor_ip = ip6_pkt.header.src_ip;
                                  self.ndp_tables
                                      .entry(ingress_iface.name.clone())
                                      .or_default()
                                      .learn_stale(neighbor_ip, eth.src_mac);
                                  self.release_pending_ipv6_transit_for_neighbor(
                                      &ingress_iface,
                                      neighbor_ip,
                                      eth.src_mac,
                                      &mut out_transmissions,
                                  );
                              }
                          }
                          ICMPV6_TYPE_NEIGHBOR_ADVERT => {
                              if let Some(neighbor_ip) = icmp6
                                  .validated_neighbor_advertisement_target(
                                      ip6_pkt.header.dst_ip,
                                      ip6_pkt.header.hop_limit,
                                  )
                              {
                                  let pending_key = (ingress_iface.name.clone(), neighbor_ip);
                                  let resolving = self
                                      .pending_ipv6_transit_packets
                                      .contains_key(&pending_key);
                                  let solicited = icmp6.payload[0] & 0x40 != 0;
                                  let override_flag = icmp6.payload[0] & 0x20 != 0;
                                  let now_ms = self.current_time_ms;

                                  let accepted_mac = {
                                      let table = self
                                          .ndp_tables
                                          .entry(ingress_iface.name.clone())
                                          .or_default();
                                      match table.lookup(&neighbor_ip) {
                                          Some(current_mac)
                                              if current_mac != eth.src_mac && !override_flag =>
                                          {
                                              // RFC 4861 section 7.2.5: Override-clear must not
                                              // replace a different cached address. A dynamic
                                              // REACHABLE entry is only demoted to STALE.
                                              table.demote_reachable_preserving_mac(neighbor_ip);
                                              None
                                          }
                                          Some(current_mac) => {
                                              if solicited {
                                                  table.confirm_reachable(
                                                      neighbor_ip,
                                                      eth.src_mac,
                                                      now_ms,
                                                  );
                                              } else if current_mac != eth.src_mac {
                                                  table.mark_stale(neighbor_ip, eth.src_mac);
                                              }
                                              Some(eth.src_mac)
                                          }
                                          None if resolving => {
                                              // INCOMPLETE resolution ignores Override because
                                              // the link-layer address is not known yet.
                                              if solicited {
                                                  table.confirm_reachable(
                                                      neighbor_ip,
                                                      eth.src_mac,
                                                      now_ms,
                                                  );
                                              } else {
                                                  table.mark_stale(neighbor_ip, eth.src_mac);
                                              }
                                              Some(eth.src_mac)
                                          }
                                          None => None,
                                      }
                                  };

                                  if let Some(dst_mac) = accepted_mac {
                                      self.release_pending_ipv6_transit_for_neighbor(
                                          &ingress_iface,
                                          neighbor_ip,
                                          dst_mac,
                                          &mut out_transmissions,
                                      );
                                  }
                              }
                          }
                          _ => {}
                      }
          '''
          text = text[:start] + new_learning + text[end:]

          replace_once(
              '''                if let Some(dst_mac) = ndp.lookup(&next_hop) {
          ''',
              '''                if let Some(dst_mac) =
                      ndp.lookup_for_transmit(&next_hop, self.current_time_ms)
                  {
          ''',
              'router IPv6 first-use NUD transition',
          )

          replace_once(
              '''    /// Runs every router's control plane and socket runtime at the current simulated
              /// time and queues whatever they emit. Routers with no socket runtime produce
              /// nothing, so a topology without a routing process is unaffected.
          ''',
              '''    /// Runs every router's forwarding/control-plane timers at the current simulated
              /// time and queues whatever they emit. This includes IPv6 NUD even when a router
              /// has no socket runtime or dynamic routing process enabled.
          ''',
              'VirtualLab pump_routers documentation',
          )

          replace_once(
              '''            let router = self.routers.get_mut(&r_name).unwrap();
                  if router.sockets.is_none() {
                      continue;
                  }
                  for (link_name, frame) in router.step_timers(now) {
          ''',
              '''            let router = self.routers.get_mut(&r_name).unwrap();
                  for (link_name, frame) in router.step_timers(now) {
          ''',
              'VirtualLab no-socket router timer skip',
          )

          path.write_text(text)

          Path('tests/test_lab_ipv6_nud.rs').write_text(r'''use std::str::FromStr;

          use toy_tcpip::ethernet::{ETHERTYPE_IPV6, EthernetFrame, MacAddress};
          use toy_tcpip::icmpv6::{
              ICMPV6_TYPE_NEIGHBOR_SOLICIT, Icmpv6Packet, NDP_DELAY_FIRST_PROBE_TIME_MS,
              NDP_REACHABLE_TIME_MS, NDP_RETRANS_TIMER_MS, NeighborState, ipv6_multicast_mac,
          };
          use toy_tcpip::ipv4::Ipv4Address;
          use toy_tcpip::ipv6::{Ipv6Address, Ipv6Packet, NEXT_HEADER_ICMPV6};
          use toy_tcpip::lab::{LabRouter, VirtualLab};

          fn ip6(text: &str) -> Ipv6Address {
              Ipv6Address::from_str(text).unwrap()
          }

          fn mac(a: u8, b: u8) -> MacAddress {
              MacAddress([0x02, 0, 0, 0, a, b])
          }

          fn router() -> LabRouter {
              let mut router = LabRouter::new("r1");
              router.add_interface(
                  "eth0",
                  mac(1, 0),
                  Ipv4Address::new(10, 1, 0, 1),
                  24,
                  "lan1",
              );
              router.add_interface(
                  "eth1",
                  mac(1, 1),
                  Ipv4Address::new(10, 2, 0, 1),
                  24,
                  "lan2",
              );
              assert!(router.set_interface_ipv6("eth0", ip6("2001:db8:1::1"), 64));
              assert!(router.set_interface_ipv6("eth1", ip6("2001:db8:2::1"), 64));
              router
          }

          fn transit_frame(dst: Ipv6Address) -> Vec<u8> {
              let packet = Ipv6Packet::serialize(
                  ip6("2001:db8:1::2"),
                  dst,
                  17,
                  64,
                  b"router-nud",
              );
              EthernetFrame::serialize(mac(1, 0), mac(0x10, 2), ETHERTYPE_IPV6, &packet)
          }

          fn na_frame(
              src: Ipv6Address,
              dst: Ipv6Address,
              target: Ipv6Address,
              src_mac: MacAddress,
              solicited: bool,
              override_flag: bool,
          ) -> Vec<u8> {
              let na = Icmpv6Packet::build_neighbor_advertisement(
                  src,
                  dst,
                  target,
                  src_mac,
                  false,
                  solicited,
                  override_flag,
              );
              let packet = Ipv6Packet::serialize(src, dst, NEXT_HEADER_ICMPV6, 255, &na);
              EthernetFrame::serialize(mac(1, 1), src_mac, ETHERTYPE_IPV6, &packet)
          }

          #[test]
          fn router_stale_neighbor_enters_delay_and_probes_without_sockets() {
              let mut router = router();
              let peer = ip6("2001:db8:2::2");
              let peer_mac = mac(0x20, 2);
              assert!(router.sockets.is_none());
              router
                  .ndp_tables
                  .get_mut("eth1")
                  .unwrap()
                  .mark_stale(peer, peer_mac);

              let forwarded = router.process_incoming_frame("lan1", &transit_frame(peer));
              assert_eq!(forwarded.len(), 1);
              assert_eq!(forwarded[0].0, "lan2");
              assert_eq!(EthernetFrame::parse(&forwarded[0].1).unwrap().dst_mac, peer_mac);
              assert_eq!(
                  router.ndp_tables["eth1"].state(&peer),
                  Some(NeighborState::Delay)
              );

              assert!(router.step_timers(NDP_DELAY_FIRST_PROBE_TIME_MS - 1).is_empty());
              for now in [
                  NDP_DELAY_FIRST_PROBE_TIME_MS,
                  NDP_DELAY_FIRST_PROBE_TIME_MS + NDP_RETRANS_TIMER_MS,
                  NDP_DELAY_FIRST_PROBE_TIME_MS + 2 * NDP_RETRANS_TIMER_MS,
              ] {
                  let probes = router.step_timers(now);
                  assert_eq!(probes.len(), 1);
                  assert_eq!(probes[0].0, "lan2");
                  let eth = EthernetFrame::parse(&probes[0].1).unwrap();
                  assert_eq!(eth.src_mac, mac(1, 1));
                  assert_eq!(eth.dst_mac, peer_mac);
                  let ipv6 = Ipv6Packet::parse(eth.payload).unwrap();
                  assert_eq!(ipv6.header.src_ip, ip6("2001:db8:2::1"));
                  assert_eq!(ipv6.header.dst_ip, peer);
                  assert_eq!(ipv6.header.hop_limit, 255);
                  let icmp = Icmpv6Packet::parse(
                      ipv6.header.src_ip,
                      ipv6.header.dst_ip,
                      ipv6.payload,
                      true,
                  )
                  .unwrap();
                  assert_eq!(icmp.msg_type, ICMPV6_TYPE_NEIGHBOR_SOLICIT);
                  let mut target = [0u8; 16];
                  target.copy_from_slice(&icmp.payload[4..20]);
                  assert_eq!(Ipv6Address(target), peer);
              }

              assert!(
                  router
                      .step_timers(
                          NDP_DELAY_FIRST_PROBE_TIME_MS + 3 * NDP_RETRANS_TIMER_MS
                      )
                      .is_empty()
              );
              assert_eq!(router.ndp_tables["eth1"].lookup(&peer), None);
          }

          #[test]
          fn virtual_lab_pumps_router_nud_without_socket_runtime() {
              let mut router = router();
              let peer = ip6("2001:db8:2::3");
              let peer_mac = mac(0x21, 3);
              let table = router.ndp_tables.get_mut("eth1").unwrap();
              table.mark_stale(peer, peer_mac);
              assert_eq!(table.lookup_for_transmit(&peer, 0), Some(peer_mac));

              let mut lab = VirtualLab::new();
              lab.add_router(router);
              lab.current_time_ms = NDP_DELAY_FIRST_PROBE_TIME_MS;
              assert_eq!(lab.pump(), 1);
              assert_eq!(lab.in_flight_frames.len(), 1);
              assert_eq!(lab.in_flight_frames[0].0, "r1");
              assert_eq!(lab.in_flight_frames[0].1, "lan2");
              let eth = EthernetFrame::parse(&lab.in_flight_frames[0].2).unwrap();
              assert_eq!(eth.dst_mac, peer_mac);
          }

          #[test]
          fn solicited_na_resolves_pending_router_transit_and_ages_dynamically() {
              let mut router = router();
              let peer = ip6("2001:db8:2::4");
              let peer_mac = mac(0x22, 4);

              let miss = router.process_incoming_frame("lan1", &transit_frame(peer));
              assert_eq!(miss.len(), 1);
              assert!(
                  router
                      .pending_ipv6_transit_packets
                      .contains_key(&("eth1".to_string(), peer))
              );

              let na = na_frame(
                  peer,
                  ip6("2001:db8:2::1"),
                  peer,
                  peer_mac,
                  true,
                  true,
              );
              let released = router.process_incoming_frame("lan2", &na);
              assert_eq!(released.len(), 1);
              assert_eq!(released[0].0, "lan2");
              assert_eq!(EthernetFrame::parse(&released[0].1).unwrap().dst_mac, peer_mac);
              assert_eq!(
                  router.ndp_tables["eth1"].state(&peer),
                  Some(NeighborState::Reachable)
              );
              assert!(
                  !router
                      .pending_ipv6_transit_packets
                      .contains_key(&("eth1".to_string(), peer))
              );

              assert!(router.step_timers(NDP_REACHABLE_TIME_MS).is_empty());
              assert_eq!(
                  router.ndp_tables["eth1"].state(&peer),
                  Some(NeighborState::Stale)
              );
          }

          #[test]
          fn override_clear_na_preserves_router_reachable_mapping() {
              let mut router = router();
              let peer = ip6("2001:db8:2::5");
              let old_mac = mac(0x23, 5);
              let new_mac = mac(0x24, 5);
              router
                  .ndp_tables
                  .get_mut("eth1")
                  .unwrap()
                  .confirm_reachable(peer, old_mac, 0);

              let na = na_frame(
                  peer,
                  ip6("2001:db8:2::1"),
                  peer,
                  new_mac,
                  true,
                  false,
              );
              assert!(router.process_incoming_frame("lan2", &na).is_empty());
              assert_eq!(router.ndp_tables["eth1"].lookup(&peer), Some(old_mac));
              assert_eq!(
                  router.ndp_tables["eth1"].state(&peer),
                  Some(NeighborState::Stale)
              );
          }

          #[test]
          fn validated_neighbor_solicitation_learns_router_neighbor_as_stale() {
              let mut router = router();
              let peer = ip6("2001:db8:2::6");
              let peer_mac = mac(0x25, 6);
              let target = ip6("2001:db8:2::1");
              let dst = target.solicited_node_multicast();
              let ns = Icmpv6Packet::build_neighbor_solicitation(peer, dst, target, peer_mac);
              let packet = Ipv6Packet::serialize(peer, dst, NEXT_HEADER_ICMPV6, 255, &ns);
              let frame = EthernetFrame::serialize(
                  ipv6_multicast_mac(dst).unwrap(),
                  peer_mac,
                  ETHERTYPE_IPV6,
                  &packet,
              );

              let replies = router.process_incoming_frame("lan2", &frame);
              assert_eq!(replies.len(), 1);
              assert_eq!(router.ndp_tables["eth1"].lookup(&peer), Some(peer_mac));
              assert_eq!(
                  router.ndp_tables["eth1"].state(&peer),
                  Some(NeighborState::Stale)
              );
          }
          ''')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --test test_lab_ipv6_nud --verbose
          cargo test --test test_lab_ipv6_ndp_solicitation --verbose
          cargo test --test test_ipv6_ndp_ingress_validation --verbose
          cargo test --test test_ipv6_router_discovery_ingress_validation --verbose
          cargo test --all-targets --verbose
          cargo build --release
          git diff --check
          rm .github/workflows/one-shot-router-nud.yml
          git add -A
          git commit -m 'feat(ipv6): add router-side NUD lifecycle'
          git push origin HEAD:feat/ipv6-router-nud-lifecycle

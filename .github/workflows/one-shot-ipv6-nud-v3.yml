name: One-shot IPv6 NUD lifecycle v3

on:
  push:
    branches:
      - feat/ipv6-nud-lifecycle

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply NUD lifecycle and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1))

          icmp = Path('src/icmpv6.rs')
          s = icmp.read_text()
          anchor = 'pub const NDP_OPT_PREFIX_INFORMATION: u8 = 3;\n'
          constants = [
              '',
              '/// RFC 4861 Neighbor Unreachability Detection defaults. Reachable Time is',
              '/// normally randomized around BaseReachableTime; this deterministic simulator',
              '/// selects the 1.0 random factor so timer-driven behavior is reproducible.',
              'pub const NDP_REACHABLE_TIME_MS: u64 = 30_000;',
              'pub const NDP_DELAY_FIRST_PROBE_TIME_MS: u64 = 5_000;',
              'pub const NDP_RETRANS_TIMER_MS: u64 = 1_000;',
              'pub const NDP_MAX_UNICAST_SOLICIT: u8 = 3;',
              '',
          ]
          if s.count(anchor) != 1:
              raise SystemExit('NDP option anchor mismatch')
          s = s.replace(anchor, anchor + '\n'.join(constants), 1)

          start = s.index('/// Dynamic Neighbor Cache Table (IPv6 NDP equivalent of ARP Cache)')
          end = s.index('#[cfg(test)]', start)
          ndp_lines = [
              '/// RFC 4861 Neighbor Unreachability Detection state for a resolved neighbor.',
              '#[derive(Debug, Clone, Copy, PartialEq, Eq)]',
              'pub enum NeighborState {',
              '    Reachable,',
              '    Stale,',
              '    Delay,',
              '    Probe,',
              '}',
              '',
              '#[derive(Debug, Clone, Copy, PartialEq, Eq)]',
              'struct NudMetadata {',
              '    state: NeighborState,',
              '    deadline_ms: Option<u64>,',
              '    probes_sent: u8,',
              '}',
              '',
              '/// Dynamic Neighbor Cache Table (IPv6 NDP equivalent of ARP Cache).',
              '///',
              '/// The existing MAC map API remains source-compatible. Direct `insert`',
              '/// calls are static/external mappings and therefore do not age; protocol',
              '/// paths opt into timed NUD with `learn_stale` and `confirm_reachable`.',
              '#[derive(Debug, Clone, Default)]',
              'pub struct NdpTable {',
              '    entries: HashMap<Ipv6Address, MacAddress>,',
              '    nud: HashMap<Ipv6Address, NudMetadata>,',
              '}',
              '',
              'impl NdpTable {',
              '    pub fn new() -> Self {',
              '        NdpTable {',
              '            entries: HashMap::new(),',
              '            nud: HashMap::new(),',
              '        }',
              '    }',
              '',
              '    pub fn insert(&mut self, ip: Ipv6Address, mac: MacAddress) {',
              '        self.entries.insert(ip, mac);',
              '        self.nud.remove(&ip);',
              '    }',
              '',
              '    /// Learns link-layer information without positive reachability evidence.',
              '    /// An unchanged mapping preserves its current NUD state; a new or changed',
              '    /// mapping becomes STALE.',
              '    pub fn learn_stale(&mut self, ip: Ipv6Address, mac: MacAddress) {',
              '        if self.entries.get(&ip).is_some_and(|current| *current == mac) {',
              '            return;',
              '        }',
              '        self.mark_stale(ip, mac);',
              '    }',
              '',
              '    pub fn mark_stale(&mut self, ip: Ipv6Address, mac: MacAddress) {',
              '        self.entries.insert(ip, mac);',
              '        self.nud.insert(',
              '            ip,',
              '            NudMetadata {',
              '                state: NeighborState::Stale,',
              '                deadline_ms: None,',
              '                probes_sent: 0,',
              '            },',
              '        );',
              '    }',
              '',
              '    /// Records positive reachability confirmation, such as a solicited NA.',
              '    pub fn confirm_reachable(&mut self, ip: Ipv6Address, mac: MacAddress, now_ms: u64) {',
              '        self.entries.insert(ip, mac);',
              '        self.nud.insert(',
              '            ip,',
              '            NudMetadata {',
              '                state: NeighborState::Reachable,',
              '                deadline_ms: Some(now_ms.saturating_add(NDP_REACHABLE_TIME_MS)),',
              '                probes_sent: 0,',
              '            },',
              '        );',
              '    }',
              '',
              '    pub fn lookup(&self, ip: &Ipv6Address) -> Option<MacAddress> {',
              '        self.entries.get(ip).copied()',
              '    }',
              '',
              '    /// Returns a mapping for transmission and performs first-use STALE -> DELAY.',
              '    pub fn lookup_for_transmit(',
              '        &mut self,',
              '        ip: &Ipv6Address,',
              '        now_ms: u64,',
              '    ) -> Option<MacAddress> {',
              '        let mac = self.entries.get(ip).copied()?;',
              '        if let Some(meta) = self.nud.get_mut(ip) {',
              '            if meta.state == NeighborState::Reachable',
              '                && meta.deadline_ms.is_some_and(|deadline| now_ms >= deadline)',
              '            {',
              '                meta.state = NeighborState::Stale;',
              '                meta.deadline_ms = None;',
              '                meta.probes_sent = 0;',
              '            }',
              '            if meta.state == NeighborState::Stale {',
              '                meta.state = NeighborState::Delay;',
              '                meta.deadline_ms =',
              '                    Some(now_ms.saturating_add(NDP_DELAY_FIRST_PROBE_TIME_MS));',
              '                meta.probes_sent = 0;',
              '            }',
              '        }',
              '        Some(mac)',
              '    }',
              '',
              '    pub fn state(&self, ip: &Ipv6Address) -> Option<NeighborState> {',
              '        self.entries.get(ip)?;',
              '        Some(',
              '            self.nud',
              '                .get(ip)',
              '                .map(|meta| meta.state)',
              '                .unwrap_or(NeighborState::Reachable),',
              '        )',
              '    }',
              '',
              '    /// Advances NUD timers and returns due unicast probes as (target, MAC).',
              '    /// Coarse time jumps emit at most one probe per neighbor per timer pump.',
              '    pub fn step_nud(&mut self, now_ms: u64) -> Vec<(Ipv6Address, MacAddress)> {',
              '        let keys: Vec<Ipv6Address> = self.nud.keys().copied().collect();',
              '        let mut probes = Vec::new();',
              '        let mut remove = Vec::new();',
              '',
              '        for ip in keys {',
              '            let Some(meta) = self.nud.get_mut(&ip) else {',
              '                continue;',
              '            };',
              '            let Some(mac) = self.entries.get(&ip).copied() else {',
              '                remove.push(ip);',
              '                continue;',
              '            };',
              '',
              '            if meta.state == NeighborState::Reachable',
              '                && meta.deadline_ms.is_some_and(|deadline| now_ms >= deadline)',
              '            {',
              '                meta.state = NeighborState::Stale;',
              '                meta.deadline_ms = None;',
              '                meta.probes_sent = 0;',
              '                continue;',
              '            }',
              '',
              '            let due = meta.deadline_ms.is_some_and(|deadline| now_ms >= deadline);',
              '            match meta.state {',
              '                NeighborState::Delay if due => {',
              '                    meta.state = NeighborState::Probe;',
              '                    meta.probes_sent = 1;',
              '                    meta.deadline_ms =',
              '                        Some(now_ms.saturating_add(NDP_RETRANS_TIMER_MS));',
              '                    probes.push((ip, mac));',
              '                }',
              '                NeighborState::Probe if due => {',
              '                    if meta.probes_sent < NDP_MAX_UNICAST_SOLICIT {',
              '                        meta.probes_sent = meta.probes_sent.saturating_add(1);',
              '                        meta.deadline_ms =',
              '                            Some(now_ms.saturating_add(NDP_RETRANS_TIMER_MS));',
              '                        probes.push((ip, mac));',
              '                    } else {',
              '                        remove.push(ip);',
              '                    }',
              '                }',
              '                _ => {}',
              '            }',
              '        }',
              '',
              '        for ip in remove {',
              '            self.entries.remove(&ip);',
              '            self.nud.remove(&ip);',
              '        }',
              '        probes',
              '    }',
              '',
              '    pub fn entries(&self) -> &HashMap<Ipv6Address, MacAddress> {',
              '        &self.entries',
              '    }',
              '}',
              '',
              '',
          ]
          icmp.write_text(s[:start] + '\n'.join(ndp_lines) + s[end:])

          stack = Path('src/stack.rs')
          s = stack.read_text()
          old = '        if let Some(dst_mac) = self.ndp_table.lookup(&next_hop) {\n'
          new = '        if let Some(dst_mac) = self\n            .ndp_table\n            .lookup_for_transmit(&next_hop, self.current_time_ms)\n        {\n'
          if s.count(old) != 1:
              raise SystemExit('send_ip6 lookup anchor mismatch')
          s = s.replace(old, new, 1)

          timer_anchor = '        // RFC 4861 Prefix List lifetimes are independent of SLAAC address\n'
          timer_lines = [
              '        // RFC 4861 NUD probes a STALE neighbor only after first use and',
              '        // DELAY_FIRST_PROBE_TIME. PROBE retransmissions are unicast and the cached',
              '        // link-layer address remains usable while reachability is revalidated.',
              '        for (target, dst_mac) in self.ndp_table.step_nud(now_ms) {',
              '            if let Some(my_ip6) = self.config.ipv6 {',
              '                let ns = Icmpv6Packet::build_neighbor_solicitation(',
              '                    my_ip6,',
              '                    target,',
              '                    target,',
              '                    self.config.mac,',
              '                );',
              '                let packet =',
              '                    Ipv6Packet::serialize(my_ip6, target, NEXT_HEADER_ICMPV6, 255, &ns);',
              '                out_frames.push(EthernetFrame::serialize(',
              '                    dst_mac,',
              '                    self.config.mac,',
              '                    ETHERTYPE_IPV6,',
              '                    &packet,',
              '                ));',
              '            }',
              '        }',
              '',
          ]
          if s.count(timer_anchor) != 1:
              raise SystemExit('timer anchor mismatch')
          s = s.replace(timer_anchor, '\n'.join(timer_lines) + timer_anchor, 1)

          ra_marker = '                                    // Only validated on-link NDP control traffic may create\n'
          ra_pos = s.index(ra_marker)
          insert_line = '                                    self.ndp_table.insert(ip6_pkt.header.src_ip, eth.src_mac);\n'
          insert_pos = s.index(insert_line, ra_pos, ra_pos + 600)
          s = s[:insert_pos] + '                                    self.ndp_table\n                                        .learn_stale(ip6_pkt.header.src_ip, eth.src_mac);\n' + s[insert_pos + len(insert_line):]

          ns_marker = '                                    // A non-DAD NS is direct on-link evidence for its source.\n'
          ns_pos = s.index(ns_marker)
          ns_insert = '                                        self.ndp_table.insert(ip6_pkt.header.src_ip, eth.src_mac);\n'
          ns_insert_pos = s.index(ns_insert, ns_pos, ns_pos + 600)
          s = s[:ns_insert_pos] + '                                        self.ndp_table\n                                            .learn_stale(ip6_pkt.header.src_ip, eth.src_mac);\n' + s[ns_insert_pos + len(ns_insert):]

          na_start_marker = '                                // A validated NA resolves the advertised target, not an\n'
          na_start = s.index(na_start_marker)
          na_end_marker = '\n                            }\n\n                            _ => {}'
          na_end = s.index(na_end_marker, na_start)
          na_lines = [
              '                                if eth.src_mac != self.config.mac',
              '                                    && self.ipv6_dad.is_some_and(|dad| dad.address == target_ip6)',
              '                                {',
              '                                    self.mark_ipv6_dad_duplicate(target_ip6);',
              '                                }',
              '',
              '                                // RFC 4861 section 7.2.5: an NA does not create a cache',
              '                                // entry from nothing. A pending packet queue represents the',
              "                                // simulator's INCOMPLETE resolution state.",
              '                                let cached_mac = self.ndp_table.lookup(&target_ip6);',
              '                                let resolving = self.pending_ndp_packets.contains_key(&target_ip6);',
              '                                if cached_mac.is_some() || resolving {',
              '                                    let solicited = icmp6.payload[0] & 0x40 != 0;',
              '                                    if solicited {',
              '                                        self.ndp_table.confirm_reachable(',
              '                                            target_ip6,',
              '                                            eth.src_mac,',
              '                                            self.current_time_ms,',
              '                                        );',
              '                                    } else if cached_mac != Some(eth.src_mac) {',
              '                                        self.ndp_table.mark_stale(target_ip6, eth.src_mac);',
              '                                    }',
              '',
              '                                    if let Some(queued_packets) =',
              '                                        self.pending_ndp_packets.remove(&target_ip6)',
              '                                    {',
              '                                        for ip6_pkt_data in queued_packets {',
              '                                            let eth_out = EthernetFrame::serialize(',
              '                                                eth.src_mac,',
              '                                                self.config.mac,',
              '                                                ETHERTYPE_IPV6,',
              '                                                &ip6_pkt_data,',
              '                                            );',
              '                                            out_frames.push(eth_out);',
              '                                        }',
              '                                    }',
              '                                }',
          ]
          s = s[:na_start] + '\n'.join(na_lines) + s[na_end:]
          stack.write_text(s)
          PY

          cat > tests/test_ipv6_nud.rs <<'RS'
          use std::str::FromStr;

          use toy_tcpip::ethernet::{ETHERTYPE_IPV6, EthernetFrame, MacAddress};
          use toy_tcpip::icmpv6::{
              ICMPV6_TYPE_NEIGHBOR_SOLICIT, Icmpv6Packet, NDP_DELAY_FIRST_PROBE_TIME_MS,
              NDP_REACHABLE_TIME_MS, NDP_RETRANS_TIMER_MS, NdpTable, NeighborState,
              ipv6_multicast_mac,
          };
          use toy_tcpip::ipv4::Ipv4Address;
          use toy_tcpip::ipv6::{Ipv6Address, Ipv6Packet, NEXT_HEADER_ICMPV6};
          use toy_tcpip::stack::{NetStack, NetStackConfig};

          fn ip6(text: &str) -> Ipv6Address {
              Ipv6Address::from_str(text).unwrap()
          }

          fn mac(last: u8) -> MacAddress {
              MacAddress([0x02, 0, 0, 0, 0, last])
          }

          fn host(address: Ipv6Address, host_mac: MacAddress) -> NetStack {
              let mut stack = NetStack::new(NetStackConfig {
                  mac: host_mac,
                  ip: Ipv4Address::new(192, 0, 2, 2),
                  ipv6: None,
                  subnet_mask: 24,
                  gateway: None,
              });
              stack.configure_ipv6_interface(address, 64, None);
              stack
          }

          fn na_frame(
              src: Ipv6Address,
              dst: Ipv6Address,
              target: Ipv6Address,
              src_mac: MacAddress,
              dst_mac: MacAddress,
              solicited: bool,
          ) -> Vec<u8> {
              let na = Icmpv6Packet::build_neighbor_advertisement(
                  src, dst, target, src_mac, false, solicited, true,
              );
              let packet = Ipv6Packet::serialize(src, dst, NEXT_HEADER_ICMPV6, 255, &na);
              EthernetFrame::serialize(dst_mac, src_mac, ETHERTYPE_IPV6, &packet)
          }

          #[test]
          fn reachable_ages_to_stale_and_first_use_enters_delay() {
              let neighbor = ip6("2001:db8:1::2");
              let neighbor_mac = mac(2);
              let mut table = NdpTable::new();
              table.confirm_reachable(neighbor, neighbor_mac, 100);
              assert_eq!(table.state(&neighbor), Some(NeighborState::Reachable));
              assert!(table.step_nud(100 + NDP_REACHABLE_TIME_MS - 1).is_empty());
              assert!(table.step_nud(100 + NDP_REACHABLE_TIME_MS).is_empty());
              assert_eq!(table.state(&neighbor), Some(NeighborState::Stale));
              assert_eq!(
                  table.lookup_for_transmit(&neighbor, 100 + NDP_REACHABLE_TIME_MS),
                  Some(neighbor_mac)
              );
              assert_eq!(table.state(&neighbor), Some(NeighborState::Delay));
          }

          #[test]
          fn delay_probes_three_times_then_removes_unreachable_neighbor() {
              let neighbor = ip6("2001:db8:2::2");
              let neighbor_mac = mac(3);
              let mut table = NdpTable::new();
              table.mark_stale(neighbor, neighbor_mac);
              assert_eq!(table.lookup_for_transmit(&neighbor, 0), Some(neighbor_mac));
              assert!(table.step_nud(NDP_DELAY_FIRST_PROBE_TIME_MS - 1).is_empty());
              for now in [
                  NDP_DELAY_FIRST_PROBE_TIME_MS,
                  NDP_DELAY_FIRST_PROBE_TIME_MS + NDP_RETRANS_TIMER_MS,
                  NDP_DELAY_FIRST_PROBE_TIME_MS + 2 * NDP_RETRANS_TIMER_MS,
              ] {
                  assert_eq!(table.step_nud(now), vec![(neighbor, neighbor_mac)]);
                  assert_eq!(table.state(&neighbor), Some(NeighborState::Probe));
              }
              assert!(table
                  .step_nud(NDP_DELAY_FIRST_PROBE_TIME_MS + 3 * NDP_RETRANS_TIMER_MS)
                  .is_empty());
              assert_eq!(table.lookup(&neighbor), None);
          }

          #[test]
          fn netstack_emits_unicast_nud_probes_and_then_restarts_resolution() {
              let host_ip = ip6("2001:db8:3::1");
              let peer_ip = ip6("2001:db8:3::2");
              let host_mac = mac(0x31);
              let peer_mac = mac(0x32);
              let mut stack = host(host_ip, host_mac);
              stack.ndp_table.mark_stale(peer_ip, peer_mac);
              let data = stack.ping6(peer_ip, 0x600d, 1, b"first").unwrap();
              assert_eq!(EthernetFrame::parse(&data).unwrap().dst_mac, peer_mac);
              for now in [
                  NDP_DELAY_FIRST_PROBE_TIME_MS,
                  NDP_DELAY_FIRST_PROBE_TIME_MS + NDP_RETRANS_TIMER_MS,
                  NDP_DELAY_FIRST_PROBE_TIME_MS + 2 * NDP_RETRANS_TIMER_MS,
              ] {
                  let frames = stack.step_timers(now);
                  assert_eq!(frames.len(), 1);
                  let eth = EthernetFrame::parse(&frames[0]).unwrap();
                  assert_eq!(eth.dst_mac, peer_mac);
                  let ip = Ipv6Packet::parse(eth.payload).unwrap();
                  assert_eq!(ip.header.dst_ip, peer_ip);
                  assert_eq!(ip.header.hop_limit, 255);
                  let icmp = Icmpv6Packet::parse(
                      ip.header.src_ip,
                      ip.header.dst_ip,
                      ip.payload,
                      true,
                  )
                  .unwrap();
                  assert_eq!(icmp.msg_type, ICMPV6_TYPE_NEIGHBOR_SOLICIT);
              }
              assert!(stack
                  .step_timers(NDP_DELAY_FIRST_PROBE_TIME_MS + 3 * NDP_RETRANS_TIMER_MS)
                  .is_empty());
              assert_eq!(stack.ndp_table.lookup(&peer_ip), None);
              let resolution = stack.ping6(peer_ip, 0x600d, 2, b"retry").unwrap();
              let eth = EthernetFrame::parse(&resolution).unwrap();
              let solicited = peer_ip.solicited_node_multicast();
              assert_eq!(eth.dst_mac, ipv6_multicast_mac(solicited).unwrap());
              let ip = Ipv6Packet::parse(eth.payload).unwrap();
              assert_eq!(ip.header.dst_ip, solicited);
              assert_eq!(stack.pending_ndp_packets.get(&peer_ip).map(Vec::len), Some(1));
          }

          #[test]
          fn solicited_na_confirms_reachability_and_cancels_probe_cycle() {
              let host_ip = ip6("2001:db8:4::1");
              let peer_ip = ip6("2001:db8:4::2");
              let host_mac = mac(0x41);
              let peer_mac = mac(0x42);
              let mut stack = host(host_ip, host_mac);
              stack.ndp_table.mark_stale(peer_ip, peer_mac);
              stack.ping6(peer_ip, 0x4861, 1, b"nud").unwrap();
              assert_eq!(stack.step_timers(NDP_DELAY_FIRST_PROBE_TIME_MS).len(), 1);
              let frame = na_frame(peer_ip, host_ip, peer_ip, peer_mac, host_mac, true);
              assert!(stack.process_frame(&frame).is_empty());
              assert_eq!(stack.ndp_table.state(&peer_ip), Some(NeighborState::Reachable));
              assert!(stack
                  .step_timers(NDP_DELAY_FIRST_PROBE_TIME_MS + NDP_RETRANS_TIMER_MS)
                  .is_empty());
          }

          #[test]
          fn unsolicited_na_updates_changed_existing_mapping_to_stale() {
              let host_ip = ip6("2001:db8:5::1");
              let peer_ip = ip6("2001:db8:5::2");
              let host_mac = mac(0x51);
              let old_mac = mac(0x52);
              let new_mac = mac(0x53);
              let mut stack = host(host_ip, host_mac);
              stack.ndp_table.confirm_reachable(peer_ip, old_mac, 0);
              let dst = Ipv6Address::LINK_LOCAL_ALL_NODES;
              let frame = na_frame(
                  peer_ip,
                  dst,
                  peer_ip,
                  new_mac,
                  ipv6_multicast_mac(dst).unwrap(),
                  false,
              );
              assert!(stack.process_frame(&frame).is_empty());
              assert_eq!(stack.ndp_table.lookup(&peer_ip), Some(new_mac));
              assert_eq!(stack.ndp_table.state(&peer_ip), Some(NeighborState::Stale));
          }

          #[test]
          fn unsolicited_na_without_cache_or_resolution_state_is_discarded() {
              let host_ip = ip6("2001:db8:6::1");
              let peer_ip = ip6("2001:db8:6::2");
              let host_mac = mac(0x61);
              let peer_mac = mac(0x62);
              let mut stack = host(host_ip, host_mac);
              let dst = Ipv6Address::LINK_LOCAL_ALL_NODES;
              let frame = na_frame(
                  peer_ip,
                  dst,
                  peer_ip,
                  peer_mac,
                  ipv6_multicast_mac(dst).unwrap(),
                  false,
              );
              assert!(stack.process_frame(&frame).is_empty());
              assert_eq!(stack.ndp_table.lookup(&peer_ip), None);
              assert_eq!(stack.ndp_table.state(&peer_ip), None);
          }
          RS

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --test test_ipv6_nud
          cargo test --test test_ipv6_ndp_learning
          cargo test --test test_ipv6_pmtud
          cargo test --all-targets
          cargo build --release
          git diff --check

          rm -f .github/workflows/one-shot-ipv6-nud.yml
          rm -f .github/workflows/one-shot-ipv6-nud-v2.yml
          rm -f .github/workflows/one-shot-ipv6-nud-v3.yml
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ipv6): add Neighbor Unreachability Detection lifecycle'
          git push origin HEAD:feat/ipv6-nud-lifecycle

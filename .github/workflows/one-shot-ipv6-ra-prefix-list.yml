name: One-shot IPv6 RA prefix-list fix

on:
  push:
    branches:
      - feat/ipv6-ra-prefix-list

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Reuse validated patch script on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Preserve the full implementation/test script from the previous staging commit
          # before merging main changes this wrapper's parent relationship.
          git show HEAD^:.github/workflows/one-shot-ipv6-ra-prefix-list.yml > /tmp/old-workflow.yml
          sed -n '/^        run: |$/,$p' /tmp/old-workflow.yml \
            | tail -n +2 \
            | sed 's/^          //' > /tmp/ra-prefix-list.sh

          # The lifetime test intentionally contains two identical assertions. Replace
          # them one at a time instead of requiring the first occurrence to be unique.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/ra-prefix-list.sh')
          s = p.read_text()
          old = 'if count != 1:'
          if s.count(old) != 1:
              raise SystemExit(f'expected one generic uniqueness guard, found {s.count(old)}')
          p.write_text(s.replace(old, 'if count < 1:', 1))
          PY

          git merge origin/main --no-edit
          bash /tmp/ra-prefix-list.sh

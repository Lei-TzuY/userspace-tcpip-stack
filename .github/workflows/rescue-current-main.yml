name: Rescue current main

on:
  push:
    branches:
      - fix/restore-current-main-20260905

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/restore-current-main-20260905
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - name: Apply deterministic CHO repair
        run: python .github/rescue-current-main.py
      - name: Format current tree
        run: cargo fmt --all
      - name: Remove construction files and commit
        shell: bash
        run: |
          git rm .github/rescue-current-main.py .github/workflows/rescue-current-main.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): restore current main baseline"
          git push origin HEAD:fix/restore-current-main-20260905

name: Stage known TCP option lengths

on:
  push:
    branches:
      - stage/tcp-known-option-lengths

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply staged source and regressions
        run: python .github/stage_tcp_known_option_lengths.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff
        run: git diff --check
      - name: Focused known-option tests
        run: cargo test --test test_tcp_known_option_lengths --verbose
      - name: Existing TCP tests
        run: cargo test tcp::tests --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/tcp.rs tests/test_tcp_known_option_lengths.rs
          git commit -m 'fix(tcp): validate known option lengths'
          git push

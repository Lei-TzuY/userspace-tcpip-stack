name: One-shot IS-IS PDU length

on:
  push:
    branches:
      - stage/isis-pdu-length-validation

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/isis-pdu-length-validation
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch, test, and clean branch
        shell: bash
        run: |
          set -euo pipefail
          python .github/isis_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test isis --verbose
          cargo test --all-targets --verbose
          cargo build --release --verbose
          git diff --check
          rm .github/workflows/one-shot-isis-pdu-length.yml .github/isis_patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(isis): honor declared PDU length'
          git push origin HEAD:stage/isis-pdu-length-validation

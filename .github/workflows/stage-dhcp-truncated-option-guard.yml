name: Stage DHCP truncated option guard

on:
  push:
    branches:
      - stage/dhcp-truncated-option-guard

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply staged source and regressions
        run: python .github/stage_dhcp_truncated_option_guard.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff
        run: git diff --check
      - name: Focused DHCP option tests
        run: cargo test --test test_dhcp_option_validation --verbose
      - name: Existing DHCP tests
        run: cargo test dhcp::tests --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/dhcp.rs tests/test_dhcp_option_validation.rs
          git commit -m 'fix(dhcp): reject truncated option headers'
          git push

name: One-shot sync IPv6 PIO branch

on:
  push:
    branches: [feat/ipv6-pio-onlink]

permissions:
  contents: write

jobs:
  sync-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Merge latest main and verify
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          cargo test --test test_ipv6_ra_onlink
          cargo test --all-targets
          cargo build --release
          rm .github/workflows/one-shot-sync-main.yml
          git add -A
          git commit -m 'chore: remove one-shot sync workflow'
          git push origin HEAD:feat/ipv6-pio-onlink

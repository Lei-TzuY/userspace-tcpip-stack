name: Stage IPv4 total-length guard

on:
  push:
    branches: [stage/ipv4-total-length-guard]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Apply staged source and regressions
        run: python scripts/apply_ipv4_total_length_guard.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Check diff
        run: git diff --check
      - name: Focused IPv4 parser tests
        run: cargo test ipv4::tests --verbose
      - name: Forwarding and ICMP regressions
        run: |
          cargo test --test test_ipv4_forwarding_header_preservation --verbose
          cargo test --test test_ipv4_icmp_error_suppression --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git fetch origin stage/ipv4-total-length-guard
          remote_head="$(git rev-parse origin/stage/ipv4-total-length-guard)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved during validation: expected $GITHUB_SHA, found $remote_head"
            exit 75
          fi
          git rm .github/workflows/stage-ipv4-total-length-guard.yml scripts/apply_ipv4_total_length_guard.py
          git add src/ipv4.rs
          git commit -m 'fix(ipv4): reject total length below header'
          git push origin HEAD:stage/ipv4-total-length-guard

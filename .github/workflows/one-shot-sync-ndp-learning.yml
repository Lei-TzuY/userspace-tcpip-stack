name: One-shot sync NDP learning

on:
  push:
    branches:
      - fix/ipv6-ndp-learning-v2

permissions:
  contents: write

jobs:
  sync-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Merge latest main and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge origin/main --no-edit
          cargo fmt --all -- --check
          cargo test --test test_ipv6_ndp_learning
          cargo test --test test_ipv6_pmtud
          cargo test --all-targets
          cargo build --release
          rm .github/workflows/one-shot-sync-ndp-learning.yml
          git diff --check
          git add -A
          git commit -m 'chore: validate NDP learning with PMTUD'
          git push origin HEAD:fix/ipv6-ndp-learning-v2

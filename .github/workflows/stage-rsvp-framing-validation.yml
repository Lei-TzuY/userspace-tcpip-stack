name: Stage RSVP framing validation

on:
  push:
    branches:
      - stage/rsvp-framing-validation

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/rsvp-framing-validation
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply staged source and regressions
        run: python scripts/stage_rsvp_framing_validation.py
      - name: Format
        run: cargo fmt --all
      - name: Check diff
        run: git diff --check
      - name: Focused RSVP framing tests
        run: cargo test --test test_rsvp_framing_validation --verbose
      - name: Existing RSVP tests
        run: cargo test rsvp --verbose
      - name: Full all-target suite
        run: cargo test --all-targets --verbose
      - name: Release build
        run: cargo build --release --verbose
      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rsvp.rs tests/test_rsvp_framing_validation.rs
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "fix(rsvp): reject malformed object framing"
          git push origin HEAD:stage/rsvp-framing-validation

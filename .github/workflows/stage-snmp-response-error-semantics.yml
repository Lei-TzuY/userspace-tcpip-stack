              }
          '''
          s = s.replace(old_test, new_test, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo fmt --all --check
          cargo test --all-targets
          cargo build --release
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/snmp.rs

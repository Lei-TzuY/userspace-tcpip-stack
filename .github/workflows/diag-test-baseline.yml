name: Diagnostic Test Baseline

on:
  push:
    branches: [ diag/clippy-baseline-20260913 ]

permissions:
  contents: read

jobs:
  test-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Capture test diagnostics
        shell: bash
        run: |
          set +e
          cargo test --locked --all-targets --all-features 2>&1 | tee test.log
          printf '%s\n' "${PIPESTATUS[0]}" > test.exit
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: test-baseline-diagnostic
          path: |
            test.log
            test.exit
          if-no-files-found: error

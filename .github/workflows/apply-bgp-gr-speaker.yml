name: Apply BGP Graceful Restart Speaker

on:
  push:
    branches: [ feat/bgp-graceful-restart-speaker ]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bgp-graceful-restart-speaker
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply restarting-speaker patch
        run: python scripts/apply_bgp_gr_speaker.py
      - name: Format
        run: cargo fmt
      - name: Run Graceful Restart integration tests
        run: cargo test --test test_bgp_graceful_restart --verbose
      - name: Run BGP capability tests
        run: cargo test --lib bgp_caps::tests --verbose
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bgp_router.rs tests/test_bgp_graceful_restart.rs
          git commit -m "feat(bgp): add RFC 4724 restarting-speaker mode"
          git push

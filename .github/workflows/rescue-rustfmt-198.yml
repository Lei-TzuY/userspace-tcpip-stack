name: Rescue rustfmt 1.98.1

on:
  push:
    branches:
      - fix/restore-ci-baseline

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out rescue branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/restore-ci-baseline
          fetch-depth: 0

      - name: Install Rust 1.98.1 with rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Apply exact CI formatter
        run: cargo fmt --all

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/rescue-rustfmt-198.yml
          git add -A
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "fix(ci): align formatting with Rust 1.98.1"
          git push origin HEAD:fix/restore-ci-baseline

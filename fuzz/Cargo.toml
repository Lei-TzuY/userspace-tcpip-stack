[package]
name = "toy_tcpip-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
toy_tcpip = { path = ".." }

[[bin]]
name = "snmp_message_parse"
path = "fuzz_targets/snmp_message_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snmp_ber_primitives"
path = "fuzz_targets/snmp_ber_primitives.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ptp_packet_parse"
path = "fuzz_targets/ptp_packet_parse.rs"
test = false
doc = false
bench = false
